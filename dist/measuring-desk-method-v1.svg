<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" role="img" aria-labelledby="title desc"><title id="title">A method illustration: look level with the water</title><desc id="desc">An eye at left faces the water surface in a jug at right. A horizontal dashed guide connects their level. This illustration gives no volume reading.</desc><rect width="640" height="270" rx="22" fill="#f8f3e6"/><path d="M72 128q36-34 72 0-36 34-72 0Z" fill="#fffdf5" stroke="#254a42" stroke-width="4"/><circle cx="108" cy="128" r="10" fill="#365f63"/><path d="M151 128H407" stroke="#477c99" stroke-width="3" stroke-dasharray="10 9"/><path d="M400 55v160q0 14 14 14h102q14 0 14-14V55" fill="#fffdf5" stroke="#254a42" stroke-width="5"/><path d="M530 83h30q32 0 32 37t-32 37h-30" fill="none" stroke="#254a42" stroke-width="5"/><path d="M404 122q61 12 122 0v86q0 10-12 10H416q-12 0-12-10Z" fill="#b6dbe2"/><path d="M404 122q61 12 122 0" fill="none" stroke="#477c99" stroke-width="3"/><path d="M151 128H465" stroke="#477c99" stroke-width="2" stroke-dasharray="8 8"/><circle cx="465" cy="128" r="3" fill="#477c99"/><path d="M365 230H616" stroke="#766f59" stroke-width="4"/><text x="36" y="45" font-family="sans-serif" font-size="23" fill="#254a42">Look level with the water</text><text x="36" y="192" font-family="sans-serif" font-size="18" fill="#254a42">Ask an adult how to read your jug.</text><text x="36" y="251" font-family="sans-serif" font-size="16" fill="#635d4e">Method illustration only: no measured amount is shown.</text></svg>