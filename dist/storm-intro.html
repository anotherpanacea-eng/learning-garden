<style>
:root{--bg:#e9efe9;--fg:#183f39;--quiet:#52675e;--track:#cbdcd3;--accent:#397958;--btn:#183f39;--btn-fg:#fafbf8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a18;--fg:#eaf4ef;--quiet:#9fb5ab;--track:#2b3d38;--accent:#e9b84a;--btn:#eaf4ef;--btn-fg:#183f39}}
:root[data-theme="dark"]{--bg:#0e1a18;--fg:#eaf4ef;--quiet:#9fb5ab;--track:#2b3d38;--accent:#e9b84a;--btn:#eaf4ef;--btn-fg:#183f39}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:16px;gap:12px}
#stage{position:relative;width:min(100%,calc(100vh - 110px),900px);aspect-ratio:1;border-radius:10px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.25);background:#183f39}
#stage canvas{width:100%;height:100%;display:block}
#start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:0;background:rgba(24,63,57,.35);color:#fafbf8;cursor:pointer;font:inherit}
#start span.circle{width:84px;height:84px;border-radius:50%;background:#fafbf8;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.3)}
#start span.label{font-weight:600;font-size:18px;text-shadow:0 1px 4px rgba(0,0,0,.5)}
#start[hidden]{display:none}
.bar{display:flex;align-items:center;gap:12px;width:min(100%,calc(100vh - 110px),900px)}
.bar button,#sound{min-height:44px;border:0;border-radius:999px;background:var(--btn);color:var(--btn-fg);font:600 14px system-ui,sans-serif;padding:8px 16px;cursor:pointer;min-width:84px}
.bar button:focus-visible,#sound:focus-visible,#start:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.track{flex:1;height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--accent)}
.back{color:var(--fg);font-weight:600}
.back:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.time{font-variant-numeric:tabular-nums;color:var(--quiet);font-size:14px;min-width:84px;text-align:right}
.embedded-film body{padding:8px;gap:8px;min-height:100dvh}.embedded-film #stage,.embedded-film .bar{width:min(100%,calc(100dvh - 140px),900px)}
</style>

<body>
<div id="stage">
 <canvas id="film" width="1080" height="1080" aria-label="Animated film: Pip the fox and Dot the ladybug shelter from a storm in an upturned flowerpot"></canvas>
 <button id="start" type="button"><span class="circle"><svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z" fill="#183f39"/></svg></span><span class="label">Play with sound</span></button>
</div>
<div class="bar"><button id="toggle" type="button" disabled>Pause</button><div class="track" aria-hidden="true"><i id="prog"></i></div><span class="time" id="time">0:00 / 0:46</span></div>
<button id="sound" type="button" hidden>Turn sound on</button>
<a class="back" href="./#home">Back to the garden</a>
<script>
// After the Storm: intro film. Every shape and sound below is made in code.
const D=46, W=1000, RES=1080, INK='#183f39';
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- math helpers ----------
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ss=(a,b,t)=>{const x=clamp((t-a)/(b-a));return x*x*(3-2*x)};
const lerp=(a,b,k)=>a+(b-a)*k;
const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const fr=x=>x-Math.floor(x);
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mixc=(a,b,k)=>{const A=Array.isArray(a)?a:hex(a),B=Array.isArray(b)?b:hex(b);return A.map((v,i)=>v+(B[i]-v)*k)};
const css=c=>Array.isArray(c)?`rgb(${c.map(Math.round).join(',')})`:c;
function track(keys,t){
 if(t<=keys[0][0])return keys[0].slice(1);
 for(let i=1;i<keys.length;i++)if(t<=keys[i][0]){const a=keys[i-1],b=keys[i],k=ss(a[0],b[0],t);return a.slice(1).map((v,j)=>lerp(v,b[j+1],k))}
 return keys[keys.length-1].slice(1);
}
const within=(t,ranges)=>ranges.some(([a,b])=>t>=a&&t<b);

// ---------- the weather, as functions of time ----------
const storm=t=>ss(2.5,8,t)*(1-ss(28,34,t));
const rainAmt=t=>ss(5,10,t)*(1-ss(28,33.5,t))*(0.62+0.38*ss(15,18,t)*(1-ss(25,29,t)));
const windAmt=t=>0.12+0.88*ss(2.5,7,t)*(1-ss(28,33,t));
const gust=t=>windAmt(t)*(0.78+0.22*Math.sin(t*1.7)+0.12*Math.sin(t*4.3+1));
const sunAmt=t=>ss(30,37,t);
// [lightning, thunder]. The gap between them grows, so the storm is moving away.
const FLASHES=[[18,18.6],[21.5,23.5],[25,28]];
const COUNTS=[[22.5,'1',0],[23.5,'2',0],[26,'1',1],[27,'2',1],[28,'3',1]];
const flash=t=>{let f=0;for(const[a]of FLASHES){const d=t-a;if(d>=0&&d<1.5)f=Math.max(f,Math.exp(-d*4.5))}return f*(reduced?0.25:0.9)};
const thunderHit=t=>{let f=0;FLASHES.forEach(([,b],i)=>{const d=t-b;if(d>=0&&d<1.5)f=Math.max(f,Math.exp(-d*5)*[1,.6,.35][i])});return f};
function camera(t){
 const push=ss(11.8,15.5,t)*(1-ss(29.5,35,t));
 const sh=reduced?0:thunderHit(t)*5;
 return {z:lerp(1.14,1.62,push),cx:lerp(520,600,push)+Math.sin(t*0.7)*3+Math.sin(t*37)*sh,cy:lerp(565,655,push)+Math.cos(t*0.5)*3+Math.cos(t*41)*sh};
}

// ---------- 2D paper layer ----------
const off=document.createElement('canvas');off.width=off.height=RES;
const g=off.getContext('2d');
const P=s=>new Path2D(s);
function piece(path,fill,{lw=2,sh=1,stroke=true}={}){
 if(sh){g.save();g.translate(1.6*sh,2.6*sh);g.fillStyle='rgba(16,38,33,.24)';g.fill(path);g.restore()}
 g.fillStyle=css(fill);g.fill(path);
 if(stroke){g.lineWidth=lw;g.strokeStyle=INK;g.stroke(path)}
}
function circ(x,y,r){const p=new Path2D();p.arc(x,y,r,0,Math.PI*2);return p}
function ell(x,y,rx,ry,rot=0){const p=new Path2D();p.ellipse(x,y,rx,ry,rot,0,Math.PI*2);return p}
function line(d,lw=2,color=INK){g.lineWidth=lw;g.strokeStyle=color;g.stroke(typeof d==='string'?P(d):d)}
function dotf(x,y,r,c=INK){g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()}
function arms(aL,aR,len=27){g.beginPath();g.moveTo(34,67);g.lineTo(34+len*Math.cos(aL),67+len*Math.sin(aL));g.moveTo(76,67);g.lineTo(76+len*Math.cos(aR),67+len*Math.sin(aR));g.lineWidth=2.4;g.strokeStyle=INK;g.stroke()}
function eyes(pts,o){
 for(const[x,y]of pts){if(o.blink){g.beginPath();g.moveTo(x-2.5,y+o.ey);g.lineTo(x+2.5,y+o.ey);g.lineWidth=1.8;g.strokeStyle=INK;g.stroke()}else dotf(x+o.ex,y+o.ey,2.2)}
}

// Pip the fox and Dot the ladybug, cut from the same paths as the game's art.
const PIP={tail:P('M32 77Q1 83 15 53L32 65Z'),tip:P('M15 53Q8 63 12 69l9-8Z'),head:P('M29 55L29 15L48 28Q58 23 67 28L85 15L84 55L58 69Z'),face:P('M31 48L58 65L81 48L65 47L58 53L49 47Z'),body:P('M39 69Q58 58 77 69L80 101H35Z'),bag:P('M62 81h22v19h-22Z'),nose:P('M54 52h8l-4 5Z'),earL:P('M33 22L33 38L43 30Z'),earR:P('M81 22L81 38L71 30Z')};
function pipTail(o){
 const c=o.curl||0;g.save();g.translate(32,70);g.rotate(-0.8*c+Math.sin(o.t*3)*0.06*(1-c));g.scale(1+0.35*c,1+0.25*c);g.translate(-32,-70);
 piece(PIP.tail,'#ce8857');piece(PIP.tip,'#fff3db');g.restore();
}
function drawPip(o,part='all'){
 g.save();g.translate(o.x,o.y);g.rotate(o.lean||0);const sq=o.sq||0;g.scale(o.s*(1+sq*.6),o.s*(1-sq));g.translate(-57,-101);
 g.lineJoin=g.lineCap='round';
 if(part!=='front'){
  if(!(o.curl>0.02))pipTail(o);
  piece(PIP.body,'#ce8857');line('M39 69l37 20');piece(PIP.bag,'#b69068');line('M64 86h18');
  g.save();g.translate(58,66);g.rotate(o.tilt||0);g.translate(-58,-66);
  piece(PIP.head,'#ce8857');piece(PIP.earL,'#fff3db',{sh:0,lw:1.4});piece(PIP.earR,'#fff3db',{sh:0,lw:1.4});piece(PIP.face,'#fff3db',{sh:0});
  eyes([[46,43],[68,43]],o);g.fillStyle=INK;g.fill(PIP.nose);
  if(o.mouth==='o'){g.beginPath();g.ellipse(58,60.5,2.2,2.8,0,0,7);g.fillStyle=INK;g.fill()}
  g.restore();
  arms(o.aL,o.aR);
 }
 if(part!=='back'&&o.curl>0.02)pipTail(o);
 g.restore();
}
const DOT={body:ell(57,76,29,28),head:circ(57,42,22)};
function drawDot(o){
 g.save();g.translate(o.x,o.y);g.rotate(o.lean||0);const sq=o.sq||0;g.scale(o.s*(1+sq*.6),o.s*(1-sq));g.translate(-57,-104);
 g.lineJoin=g.lineCap='round';
 const w=o.ant||0;
 g.beginPath();g.moveTo(39,31);g.lineTo(32+w,19);g.moveTo(73,31);g.lineTo(81+w,19);g.lineWidth=2;g.strokeStyle=INK;g.stroke();
 dotf(32+w,18,3.2);dotf(81+w,18,3.2);
 piece(DOT.body,'#da8d8d');line('M57 50v52');
 for(const[x,y,r]of[[43,72,5],[71,72,5],[42,88,4],[72,88,4]])dotf(x,y,r);
 g.save();g.translate(57,62);g.rotate(o.tilt||0);g.translate(-57,-62);
 piece(DOT.head,'#fff3db');
 g.beginPath();g.arc(47,42,9,0,7);g.moveTo(76,42);g.arc(67,42,9,0,7);g.moveTo(56,42);g.lineTo(58,42);g.lineWidth=2;g.strokeStyle=INK;g.stroke();
 eyes([[47,42],[67,42]],o);
 if(o.mouth==='o'){g.beginPath();g.ellipse(57,56,3,3.6,0,0,7);g.fillStyle=INK;g.fill()}
 else line(o.mouth==='flat'?'M52 56h10':'M51 55q6 5 12-1');
 g.restore();
 arms(o.aL,o.aR);
 g.restore();
}
function drawSnail(o){
 g.save();g.translate(o.x,o.y);g.scale(o.s*(o.dir||1),o.s);g.lineJoin=g.lineCap='round';
 const r=o.hide||0;
 g.save();g.translate(-4,0);g.scale(1-0.75*r,1);g.translate(4,0);
 piece(P('M-40 0Q-44-14-24-16L22-16Q32-18 34-32Q40-46 48-34Q54-12 42 0Z'),'#b5c98f');
 const st=1-r;
 if(st>0.05){g.beginPath();g.moveTo(40,-38);g.lineTo(36,-38-22*st);g.moveTo(45,-37);g.lineTo(50,-37-20*st);g.lineWidth=2;g.strokeStyle=INK;g.stroke();dotf(36,-39-22*st,3.4);dotf(50,-38-20*st,3.4);}
 g.restore();
 g.save();g.translate(-6,-34);g.rotate(Math.sin(o.t*2)*0.03);
 piece(circ(0,0,27),'#e9b84a');
 g.beginPath();for(let a=0;a<4*Math.PI;a+=0.2){const rr=3+a*1.6;g.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}g.lineWidth=2;g.strokeStyle=INK;g.stroke();
 g.restore();g.restore();
}
function drawBird(o){
 g.save();g.translate(o.x,o.y);g.scale(o.s*(o.dir||1),o.s);g.lineJoin=g.lineCap='round';
 const f=1+(o.fluff||0)*0.18;
 if(!o.flying){g.beginPath();g.moveTo(-3,-6);g.lineTo(-4,0);g.moveTo(4,-6);g.lineTo(5,0);g.lineWidth=2;g.strokeStyle=INK;g.stroke()}
 piece(P('M-15-17L-32-25L-29-11Z'),'#835c42');
 piece(ell(0,-19,18*f,14*f),'#b69068');piece(ell(4,-14,10*f,7.5*f),'#fff3db',{sh:0});
 piece(circ(13,-33,10),'#b69068');dotf(16,-35,1.9);
 if(o.sing){piece(P('M21-36l9-3l-8 4Z'),'#e9b84a',{sh:0,lw:1.4});piece(P('M21-33l9 4l-9-1Z'),'#e9b84a',{sh:0,lw:1.4})}
 else piece(P('M21-35l9 2l-9 3Z'),'#e9b84a',{sh:0,lw:1.4});
 g.save();g.translate(-2,-22);g.rotate(o.flap||0);piece(ell(-6,0,13,6.5),'#835c42');g.restore();
 g.restore();
}
function drawLetter(x,y,rot,s=1){
 g.save();g.translate(x,y);g.rotate(rot);g.scale(s,s);g.translate(-37,-27);
 piece(P('M0 0h74v55H0Z'),'#fffdf4',{lw:2});
 g.beginPath();g.moveTo(0,4);g.lineTo(37,30);g.lineTo(74,4);g.moveTo(2,53);g.lineTo(29,31);g.moveTo(72,53);g.lineTo(45,31);g.lineWidth=2;g.strokeStyle='#c5b789';g.stroke();
 piece(circ(37,28,7),'#da8d8d',{sh:0,lw:1.5});g.restore();
}
function leafShape(){return P('M0 25Q-25-10 0-35Q26-10 0 25Z')}
const LEAF=leafShape();
function drawLeaf(x,y,rot,s,c='#75a183'){g.save();g.translate(x,y);g.rotate(rot);g.scale(s,s);piece(LEAF,c,{lw:2.4});line('M0 22v-44',2,'#397958');g.restore()}

// ---------- scenery ----------
const POT={x:600,y:700,r:140,R:165,bx:675,by:650,br:112};
const BUSHES=[...Array(13)].map((_,i)=>({x:-60+i*95+hash(i)*30,y:575+hash(i+9)*20,r:48+hash(i+3)*22}));
const BACKFLOWERS=[...Array(9)].map((_,i)=>({x:40+i*118+hash(i+40)*40,y:655+hash(i+41)*25,h:40+hash(i+42)*25,s:.55}));
const FRONTFLOWERS=[{x:95,y:965,h:120,s:1.15},{x:205,y:1005,h:95,s:1},{x:930,y:990,h:110,s:1.1},{x:330,y:985,h:70,s:.8},{x:700,y:1000,h:70,s:.8}];
const PUDDLES=[[245,935,72,13],[800,948,64,12],[455,990,58,11]];
const GROUNDLEAVES=[...Array(11)].map((_,i)=>({x:120+hash(i+60)*780,y:900+hash(i+61)*90,r:hash(i+62)*6,t:13+hash(i+63)*13}));
function cloudPath(x,y,s,seed){const p=new Path2D();for(let i=0;i<6;i++){const cx=x+(i-2.5)*38*s+hash(seed+i)*14*s,cy=y-hash(seed+i+.3)*40*s,r=(34+hash(seed+i+.7)*26)*s;p.moveTo(cx+r,cy);p.arc(cx,cy,r,0,7)}p.rect(x-120*s,y-6*s,240*s,34*s);return p}
const CLOUDS=[...Array(11)].map((_,i)=>({x:-80+i*115+hash(i+20)*50,y:60+hash(i+21)*170,s:.9+hash(i+22)*.8,layer:i%3,seed:i*7}));

function sky(t){
 const st=storm(t),sun=sunAmt(t);
 const top=mixc(mixc('#a9cadb','#6f8193',st),'#9ccbe0',sun),bot=mixc(mixc('#eef4e8','#9fadb5',st),'#fbe6b4',sun);
 const gr=g.createLinearGradient(0,-250,0,640);gr.addColorStop(0,css(top));gr.addColorStop(1,css(bot));
 g.fillStyle=gr;g.fillRect(-500,-500,2000,1200);
 if(sun>0){g.save();g.globalAlpha=sun;const sy=lerp(330,175,sun);
  const halo=g.createRadialGradient(805,sy,10,805,sy,260);halo.addColorStop(0,'rgba(255,240,190,.9)');halo.addColorStop(1,'rgba(255,240,190,0)');g.fillStyle=halo;g.fillRect(500,-200,700,700);
  piece(circ(805,sy,58),'#f3d78f',{lw:2.4});g.restore()}
 // morning sun before the storm
 const early=1-ss(2,6,t);if(early>0){g.save();g.globalAlpha=early;piece(circ(805,150,46),'#f3d78f',{lw:2.4});g.restore()}
 const rb=ss(34,40,t);
 if(rb>0){g.save();g.globalAlpha=rb*.55;['#da8d8d','#e9b84a','#f3d78f','#90b48f','#abc4da','#bdb3d6'].forEach((c,i)=>{g.beginPath();g.arc(330,700,470-i*16,Math.PI*1.05,Math.PI*1.95);g.lineWidth=16;g.strokeStyle=c;g.stroke()});g.restore()}
}
function clouds(t){
 const enter=ss(0.5,7.5,t),leave=ss(28.5,36,t),st=storm(t);
 // two fair-weather clouds from the game's opening scene
 g.save();g.globalAlpha=1-ss(3,7,t)+ss(38,44,t);
 piece(cloudPath(250+t*4,95,.55,91),'#fbfcfa',{stroke:false});piece(cloudPath(600+t*3,70,.45,93),'#fbfcfa',{stroke:false});g.restore();
 for(const c of CLOUDS){
  const x=c.x-(1-enter)*(1350+c.layer*150)+leave*(1500+c.layer*200)+Math.sin(t*.3+c.seed)*18+t*2*(c.layer+1);
  if(x<-500||x>1500)continue;
  const col=mixc(['#d9e3e8','#c3cfd8','#aebbc6'][c.layer],['#61717f','#56606d','#4b5764'][c.layer],st);
  piece(cloudPath(x,c.y+c.layer*30,c.s,c.seed),col,{stroke:false,sh:1.5});
 }
}
function bolt(t){
 FLASHES.forEach(([a],i)=>{const d=t-a;if(d<0||d>0.4)return;
  const x0=[820,250,690][i],pts=[];for(let k=0;k<=7;k++)pts.push([x0+(hash(i*9+k)-.5)*70+k*6,140+k*58]);
  const p=new Path2D();pts.forEach(([x,y],k)=>k?p.lineTo(x+7,y):p.moveTo(x+7,y));for(let k=pts.length-1;k>=0;k--)p.lineTo(pts[k][0]-7+(k===pts.length-1?7:0),pts[k][1]);p.closePath();
  g.save();g.globalAlpha=1-d/0.4;piece(p,'#fff1b8',{lw:2});g.restore();
 });
}
function hills(t){
 piece(P('M-300 640Q-40 470 300 540Q560 430 850 520Q1050 470 1300 560V760H-300Z'),'#90b48f',{stroke:false});
 const gu=gust(t);
 // fence where the sparrow lives
 g.save();g.lineJoin='round';
 piece(P('M60 520h360v14H60Zm0 40h360v14H60Z'),'#b69068',{lw:1.8});
 for(const x of[80,240,400])piece(P(`M${x-10} 610V488l10-12l10 12V610Z`),'#b69068',{lw:1.8});
 g.restore();
 for(const b of BUSHES){const x=b.x+Math.sin(t*2.1+b.x)*gu*6;piece(circ(x,b.y,b.r),'#75a183',{stroke:false,sh:1.2})}
}
function ground(t){
 piece(P('M-300 600Q300 560 600 600T1300 590V1300H-300Z'),'#d1e3cb',{stroke:false,sh:0});
 piece(P('M300 1300Q260 920 430 800Q525 720 500 598L540 598Q575 735 480 815Q370 930 590 1300Z'),'#f4e5bd',{stroke:false,sh:0});
 const pud=0.35+0.65*ss(8,24,t);
 PUDDLES.forEach(([x,y,rx,ry],i)=>{
  piece(ell(x,y,rx*pud,ry*pud),'#abc4da',{stroke:false,sh:0});

 // paper: soft blotches plus long fibres

 col*=.94+.09*gr;
 // storm light

 // morning sun and rays
 vec2 d=uv-sunPos;float a=atan(d.y,d.x);
 float ray=pow(n(vec2(a*9.,T*.15)),3.)*(1.-smoothstep(0.,1.1,length(d)));
 col+=sun*vec3(1.,.86,.55)*(ray*.22+.08*(1.-smoothstep(0.,.7,length(d))));
 col*=mix(vec3(1),vec3(1.04,1.,.93),sun);
 float v=length(uv-.5);col*=1.-(.16+.22*storm)*smoothstep(.3,.85,v);
 o=vec4(col,1);
}`;
 const sh=(type,src)=>{const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s};
 const prog=gl.createProgram();gl.attachShader(prog,sh(gl.VERTEX_SHADER,vs));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(prog);gl.useProgram(prog);
 const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
 const loc=gl.getAttribLocation(prog,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
 const tx=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tx);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
 gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
 const U=k=>gl.getUniformLocation(prog,k);
 present=(t,u)=>{gl.viewport(0,0,RES,RES);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,off);
  gl.uniform1f(U('T'),t);gl.uniform1f(U('storm'),u.storm);gl.uniform1f(U('flash'),u.flash);gl.uniform1f(U('sun'),u.sun);gl.uniform1f(U('rain'),u.rain);gl.uniform2f(U('sunPos'),u.sunPos[0],u.sunPos[1]);
  gl.drawArrays(gl.TRIANGLES,0,3)};
}else{
 const c2=cv.getContext('2d');present=()=>{c2.drawImage(off,0,0)};
}
function draw(t){present(t,paint(t))}

// ---------- sound, all synthesized ----------
function buildAudio(ac,out,t0){
 const sr=ac.sampleRate;let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
 const white=ac.createBuffer(1,sr*2,sr);{const d=white.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=rnd()*2-1}
 const brown=ac.createBuffer(1,sr*4,sr);{const d=brown.getChannelData(0);let l=0;for(let i=0;i<d.length;i++){l=(l+0.02*(rnd()*2-1))/1.02;d[i]=l*3.5}}
 const src=(b,loop=true)=>{const s=ac.createBufferSource();s.buffer=b;s.loop=loop;return s};
 const filt=(type,f,q=0.7)=>{const b=ac.createBiquadFilter();b.type=type;b.frequency.value=f;b.Q.value=q;return b};
 const gain=v=>{const x=ac.createGain();x.gain.value=v;return x};
 const at=x=>t0+x,N=m=>440*Math.pow(2,(m-69)/12);
 const master=gain(0.85),comp=ac.createDynamicsCompressor();master.connect(comp).connect(out);
 master.gain.setValueAtTime(0.85,at(44.5));master.gain.linearRampToValueAtTime(0,at(D));
 // rain and wind follow the same curves the picture uses
 const rn=src(white),rhp=filt('highpass',500),rlp=filt('lowpass',8000),rg=gain(0);rn.connect(rhp).connect(rlp).connect(rg).connect(master);
 const wn=src(brown),wbp=filt('bandpass',400,0.6),wg=gain(0);wn.connect(wbp).connect(wg).connect(master);
 rg.gain.setValueAtTime(0,at(0));wg.gain.setValueAtTime(0,at(0));rlp.frequency.setValueAtTime(8000,at(0));wbp.frequency.setValueAtTime(400,at(0));
 for(let t=0.25;t<=D;t+=0.25){const ins=ss(12.5,15,t)*(1-ss(29.5,33,t));
  rg.gain.linearRampToValueAtTime(0.3*rainAmt(t)*(1-0.35*ins),at(t));rlp.frequency.linearRampToValueAtTime(lerp(8000,1500,ins),at(t));
  wg.gain.linearRampToValueAtTime(0.9*windAmt(t)*(0.6+0.4*Math.sin(t*1.7))*(1-0.45*ins),at(t));wbp.frequency.linearRampToValueAtTime(220+480*gust(t),at(t))}
 rn.start(at(0));wn.start(at(0));rn.stop(at(D));wn.stop(at(D));
 // thunder, each one farther away
 FLASHES.forEach(([,th],i)=>{const near=[1,.7,.45][i];
  const s=src(brown),lp=filt('lowpass',[320,220,170][i]),gn=gain(0);s.connect(lp).connect(gn).connect(master);
  gn.gain.setValueAtTime(0,at(th));gn.gain.linearRampToValueAtTime(2.2*near,at(th+0.07));let tt=th+0.07;
  for(let k=0;k<6;k++){tt+=0.22+rnd()*0.35;gn.gain.linearRampToValueAtTime((0.5+rnd()*0.9)*near*(1-k/7)*1.6,at(tt))}
  gn.gain.linearRampToValueAtTime(0,at(tt+1.3));s.start(at(th));s.stop(at(tt+1.5));
  if(i===0){const c=src(white,false),hp=filt('highpass',1200),cg=gain(0);c.connect(hp).connect(cg).connect(master);cg.gain.setValueAtTime(0.5,at(th));cg.gain.exponentialRampToValueAtTime(0.001,at(th+0.35));c.start(at(th));c.stop(at(th+0.4))}
 });
 const bell=(time,f,v=0.12,dec=1.6)=>{for(const[m,a]of[[1,1],[2.01,.32],[3.9,.1]]){const o=ac.createOscillator();o.frequency.value=f*m;const e=gain(0);o.connect(e).connect(master);
  e.gain.setValueAtTime(0,at(time));e.gain.linearRampToValueAtTime(v*a,at(time+0.008));e.gain.exponentialRampToValueAtTime(0.0001,at(time+dec/m));o.start(at(time));o.stop(at(time+dec/m+0.05))}};
 const pad=(notes,a,b,v,type='sine',lpF=900)=>{const lp=filt('lowpass',lpF),e=gain(0);lp.connect(e).connect(master);
  e.gain.setValueAtTime(0,at(a));e.gain.linearRampToValueAtTime(v,at(a+2));e.gain.setValueAtTime(v,at(b-2));e.gain.linearRampToValueAtTime(0,at(b));
  notes.forEach((m,i)=>{const o=ac.createOscillator();o.type=type;o.frequency.value=N(m);o.detune.value=(i%2?6:-6);o.connect(lp);o.start(at(a));o.stop(at(b+0.1))})};
 // a happy start, cut off by one raindrop
 [[0.25,72],[0.6,76],[0.95,79],[1.3,81]].forEach(([t,m])=>bell(t,N(m),0.1,1.2));
 {const o=ac.createOscillator(),e=gain(0);o.frequency.setValueAtTime(480,at(1.5));o.frequency.exponentialRampToValueAtTime(1350,at(1.6));o.connect(e).connect(master);
  e.gain.setValueAtTime(0.25,at(1.5));e.gain.exponentialRampToValueAtTime(0.001,at(1.75));o.start(at(1.5));o.stop(at(1.8))}
 pad([45,52],3,14,0.05,'triangle',500);
 pad([48,55,64],13.5,31,0.03);
 [[15.4,67],[16.2,64],[17,60]].forEach(([t,m])=>bell(t,N(m),0.05,1.8));
 COUNTS.forEach(([t])=>bell(t,N(88),0.07,0.6));
 // rain ticking on the pot
 for(let t=13.2;t<29.5;t+=0.16+rnd()*0.42)if(rainAmt(t)>0.3)bell(t,1700+rnd()*1700,0.025,0.14);
 // the sun comes back
 [[31.6,72],[32,76],[32.4,79],[32.8,84],[34.6,84],[34.9,86],[35.2,88],[36.4,86],[36.8,84],[37.2,81],[37.6,79],[40.6,91],[41.5,88],[42.4,84]].forEach(([t,m])=>bell(t,N(m),0.09,1.5));
 [72,76,79,84].forEach(m=>bell(39.5,N(m),0.08,4.5));
 pad([48,55,64,67],38.8,D,0.035);
 for(let t=35.8;t<39.2;t+=0.12+rnd()*0.3){const o=ac.createOscillator(),e=gain(0),f=2600+rnd()*900;o.frequency.setValueAtTime(f,at(t));o.frequency.exponentialRampToValueAtTime(f*1.5,at(t+0.07));o.connect(e).connect(master);
  e.gain.setValueAtTime(0.05,at(t));e.gain.exponentialRampToValueAtTime(0.001,at(t+0.09));o.start(at(t));o.stop(at(t+0.1))}
 {const s=src(white),bp=filt('bandpass',3000,1.2),e=gain(0);s.connect(bp).connect(e).connect(master);e.gain.setValueAtTime(0,at(35.3));
  for(let t=35.4;t<38.8;t+=0.18)e.gain.linearRampToValueAtTime(0.03+0.04*Math.abs(Math.sin(t*9)),at(t));e.gain.linearRampToValueAtTime(0,at(38.9));s.start(at(35.3));s.stop(at(39))}
 bell(38.8,N(60),0.06,0.4);
}
function wav(buf){const ch=buf.numberOfChannels,len=buf.length*ch*2+44,ab=new ArrayBuffer(len),v=new DataView(ab);let p=0;
 const s=x=>{for(const c of x)v.setUint8(p++,c.charCodeAt(0))},u32=x=>{v.setUint32(p,x,true);p+=4},u16=x=>{v.setUint16(p,x,true);p+=2};
 s('RIFF');u32(len-8);s('WAVEfmt ');u32(16);u16(1);u16(ch);u32(buf.sampleRate);u32(buf.sampleRate*ch*2);u16(ch*2);u16(16);s('data');u32(len-44);
 const data=[...Array(ch)].map((_,i)=>buf.getChannelData(i));for(let i=0;i<buf.length;i++)for(let c=0;c<ch;c++){v.setInt16(p,clamp(data[c][i],-1,1)*32767,true);p+=2}
 return new Blob([ab],{type:'audio/wav'})}

// ---------- playback ----------
const startBtn=document.getElementById('start'),toggle=document.getElementById('toggle'),prog=document.getElementById('prog'),timeEl=document.getElementById('time'),soundButton=document.getElementById('sound');
let ac=null,playing=false,clock0=0,heldAt=0,frameRequest=null;
let soundEnabled=false,audioSource=null,audioRequest=0,scorePromise=null;
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
// Picture time never depends on creating, rendering or resuming an audio context.
const now=()=>playing?(performance.now()-clock0)/1000:heldAt;
function stopAudio(){audioRequest++;if(audioSource){try{audioSource.stop();audioSource.disconnect();}catch{}audioSource=null;}}
function updateSound(){soundButton.textContent=soundEnabled?'Turn sound off':'Turn sound on';}
function scoreBuffer(){
 if(!scorePromise){
  const Offline=window.OfflineAudioContext||window.webkitOfflineAudioContext;
  if(!Offline)throw new Error('Offline audio unavailable');
  const offline=new Offline(2,Math.ceil(48000*D),48000);
  buildAudio(offline,offline.destination,0);
  scorePromise=offline.startRendering();
 }
 return scorePromise;
}
function joinAudio(){
 const request=++audioRequest;
 // Request media playback on supported WebKit before starting sound. Silent film autoplay never calls this.
 try{if(window.navigator?.audioSession)window.navigator.audioSession.type='playback';}catch{}
 try{
  const AC=window.AudioContext||window.webkitAudioContext;
  ac||=new AC();const context=ac;
  // Resume within the tap, then seek the rendered score when it is ready.
  const resumed=context.resume(),buffer=scoreBuffer();
  Promise.all([resumed,buffer]).then(([,score])=>{
   if(request!==audioRequest||!soundEnabled||!playing||context!==ac)return;
   const offset=Math.max(0,now());if(offset>=D)return;
   const source=context.createBufferSource();source.buffer=score;source.connect(context.destination);
   source.start(context.currentTime,offset);audioSource=source;
  }).catch(()=>audioUnavailable(request));
 }catch{audioUnavailable(request);}
}
function audioUnavailable(request){
 if(request!==audioRequest)return;
 stopAudio();soundEnabled=false;updateSound();soundButton.textContent='Sound unavailable';soundButton.disabled=true;
}
function tick(){
 frameRequest=null;if(!playing)return;let t=now();
 if(t>=D){t=D;heldAt=D;playing=false;stopAudio();toggle.textContent='Replay';if(embedded)parent.postMessage('garden-film-finished',location.origin);}
 draw(Math.max(0,t));prog.style.width=(clamp(t/D)*100)+'%';timeEl.textContent=`${fmt(Math.max(0,t))} / ${fmt(D)}`;
 if(playing)frameRequest=requestAnimationFrame(tick);
}
function start(sound=true){
 if(frameRequest!==null)cancelAnimationFrame(frameRequest);stopAudio();
 heldAt=0;clock0=performance.now();playing=true;soundEnabled=sound;updateSound();
 startBtn.hidden=true;soundButton.hidden=false;toggle.disabled=false;toggle.textContent='Pause';
 if(soundEnabled)joinAudio();frameRequest=requestAnimationFrame(tick);
}
startBtn.addEventListener('click',()=>start(true));
toggle.addEventListener('click',()=>{
 if(toggle.textContent==='Replay')return start(soundEnabled);
 if(playing){heldAt=now();playing=false;if(frameRequest!==null)cancelAnimationFrame(frameRequest);stopAudio();toggle.textContent='Play';}
 else{clock0=performance.now()-heldAt*1000;playing=true;toggle.textContent='Pause';if(soundEnabled)joinAudio();frameRequest=requestAnimationFrame(tick);}
});
cv.addEventListener('click',()=>{if(!toggle.disabled)toggle.click();});
addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();startBtn.hidden?toggle.click():start();}});
addEventListener('pagehide',()=>{heldAt=Math.min(D,now());playing=false;stopAudio();if(frameRequest!==null)cancelAnimationFrame(frameRequest);frameRequest=null;toggle.textContent=heldAt>=D?'Replay':'Play';const context=ac;ac=null;if(context)context.close().catch(()=>{});});
const params=new URLSearchParams(location.search),embedded=params.get('embedded')==='1';
if(embedded){document.documentElement.classList.add('embedded-film');document.querySelector('.back').hidden=true;}
soundButton.onclick=()=>{stopAudio();soundEnabled=!soundEnabled;updateSound();if(soundEnabled&&playing)joinAudio();};
if(params.get('autoplay')==='1'){
 soundButton.hidden=false;
 if(!matchMedia('(prefers-reduced-motion: reduce)').matches)start(false);
 else draw(15.2);
}else draw(15.2);

// For recording: step the clock yourself, one frame at a time.
window.film={duration:D,draw,canvas:cv,async audioWav(rate=48000){const oac=new OfflineAudioContext(2,Math.ceil(rate*D),rate);buildAudio(oac,oac.destination,0);return wav(await oac.startRendering())}};
