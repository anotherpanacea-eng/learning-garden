<svg xmlns="http://www.w3.org/2000/svg" width="320" height="2092" viewBox="0 0 320 2092" role="img" aria-labelledby="title desc"><title id="title">Same pour, new unit, 320 pixel design</title><desc id="desc">Supplied example. In the jug: three hundred fifty milliliters equals zero point three five liters. Jug capacity: one liter equals one thousand milliliters. 20 equal small spaces; 21 marks. Each space is fifty milliliters, or zero point zero five liters. Seven spaces reach the level. Reserve outside the jug: six hundred fifty milliliters. The empty space inside the jug is not reserve liquid. Scale selected: liters. All writing and art original.</desc><rect width="320" height="2092" fill="#f6f0df"/><rect x="16" y="12" width="288" height="48" rx="8" fill="#fffdf5" stroke="#81958b"/><text x="28" y="42" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">← Back to Measuring Kitchen</text><text x="16" y="98" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#283f3b">Same pour,</text><text x="16" y="134" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#283f3b">new unit</text><text x="16" y="155" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">Read a recipe and a jug when</text><text x="16" y="178" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">their labels use different units.</text><rect x="16" y="203" width="288" height="72" rx="12" fill="#e6ebd9" stroke="#81958b"/><text x="30" y="228" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#283f3b">Supplied recipe label:</text><text x="30" y="252" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#283f3b">0.35&#160;L = 350&#160;mL.</text><text x="16" y="299" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">1&#160;L = 1000&#160;mL. A milliliter is</text><text x="16" y="322" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">the smaller unit, so the same</text><text x="16" y="345" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">amount needs more milliliters</text><text x="16" y="368" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">than liters.</text><text x="16" y="401" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#283f3b">Change the unit label:</text><text x="16" y="424" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">the liquid stays still.</text><rect x="16" y="438" width="112" height="48" rx="8" fill="#fffdf5" stroke="#81958b"/><text x="28" y="468" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">mL</text><rect x="140" y="438" width="140" height="48" rx="8" fill="#255b4d" stroke="#255b4d"/><text x="152" y="468" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#fffdf5">L  ✓ Selected</text><rect x="16" y="505" width="288" height="540" rx="12" fill="#fffdf5" stroke="#81958b"/><text x="32" y="535" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#283f3b">Jug scale:&#160;L (liters)</text><path d="M243 640h22q35 0 35 38v65q0 35-35 35h-22" fill="none" stroke="#81958b" stroke-width="7"/><rect x="131" y="784" width="108" height="91" fill="#b1d7d2"/><path d="M131 615v260h108v-260" fill="none" stroke="#283f3b" stroke-width="3"/><path d="M131 784h108" stroke="#255b4d" stroke-width="3"/><path d="M128 875h-15" stroke="#283f3b" stroke-width="1.5"/><text x="71" y="880" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">0.0</text><path d="M128 862h-9" stroke="#283f3b" stroke-width="1.5"/><path d="M128 849h-15" stroke="#283f3b" stroke-width="1.5"/><text x="71" y="854" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">0.1</text><path d="M128 836h-9" stroke="#283f3b" stroke-width="1.5"/><path d="M128 823h-15" stroke="#283f3b" stroke-width="1.5"/><text x="71" y="828" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">0.2</text><path d="M128 810h-9" stroke="#283f3b" stroke-width="1.5"/><path d="M128 797h-15" stroke="#283f3b" stroke-width="1.5"/><text x="71" y="802" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">0.3</text><path d="M128 784h-9" stroke="#283f3b" stroke-width="1.5"/><path d="M128 771h-15" stroke="#283f3b" stroke-width="1.5"/><text x="71" y="776" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">0.4</text><path d="M128 758h-9" stroke="#283f3b" stroke-width="1.5"/><path d="M128 745h-15" stroke="#283f3b" stroke-width="1.5"/><text x="71" y="750" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">0.5</text><path d="M128 732h-9" stroke="#283f3b" stroke-width="1.5"/><path d="M128 719h-15" stroke="#283f3b" stroke-width="1.5"/><text x="71" y="724" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">0.6</text><path d="M128 706h-9" stroke="#283f3b" stroke-width="1.5"/><path d="M128 693h-15" stroke="#283f3b" stroke-width="1.5"/><text x="71" y="698" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">0.7</text><path d="M128 680h-9" stroke="#283f3b" stroke-width="1.5"/><path d="M128 667h-15" stroke="#283f3b" stroke-width="1.5"/><text x="71" y="672" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">0.8</text><path d="M128 654h-9" stroke="#283f3b" stroke-width="1.5"/><path d="M128 641h-15" stroke="#283f3b" stroke-width="1.5"/><text x="71" y="646" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">0.9</text><path d="M128 628h-9" stroke="#283f3b" stroke-width="1.5"/><path d="M128 615h-15" stroke="#283f3b" stroke-width="1.5"/><text x="71" y="620" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">1.0</text><path d="M241 784h18" stroke="#255b4d" stroke-width="2"/><text x="32" y="567" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#283f3b">Jug capacity: 1&#160;L = 1000&#160;mL.</text><text x="32" y="590" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536963">The most this jug can hold.</text><text x="32" y="913" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">20 equal small spaces; 21 marks.</text><text x="32" y="936" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">Each small space:</text><text x="32" y="959" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">50&#160;mL = 0.05&#160;L.</text><text x="32" y="982" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">Count spaces from zero, not marks.</text><text x="16" y="1072" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#283f3b">In the jug:</text><text x="16" y="1097" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#283f3b">350&#160;mL = 0.35&#160;L.</text><text x="16" y="1122" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#283f3b">7 small spaces reach</text><text x="16" y="1147" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#283f3b">the liquid level.</text><text x="16" y="1186" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">Reserve outside the jug:</text><text x="16" y="1209" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">650&#160;mL.</text><text x="16" y="1243" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">The empty space inside the jug</text><text x="16" y="1266" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">is not reserve liquid.</text><text x="16" y="1300" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">Jug + reserve = 1000&#160;mL.</text><text x="16" y="1345" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#283f3b">Move one 50&#160;mL measure:</text><text x="16" y="1368" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#283f3b">the liquid level changes.</text><rect x="16" y="1385" width="134" height="48" rx="8" fill="#eee8d8" stroke="#81958b"/><text x="28" y="1415" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536963">Add 50&#160;mL</text><rect x="160" y="1385" width="144" height="48" rx="8" fill="#fffdf5" stroke="#81958b"/><text x="172" y="1415" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">Return 50&#160;mL</text><text x="16" y="1459" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">This example moves between</text><text x="16" y="1482" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">300&#160;mL and 350&#160;mL.</text><rect x="16" y="1492" width="230" height="48" rx="8" fill="#fffdf5" stroke="#81958b"/><text x="28" y="1522" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">Undo last change</text><text x="16" y="1566" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#255b4d">50&#160;mL moved from reserve to jug.</text><text x="16" y="1589" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#255b4d">In the jug: 350&#160;mL = 0.35&#160;L.</text><text x="16" y="1634" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">Pretend liquid, exact picture amounts.</text><text x="16" y="1657" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">This straight-sided jug is a model,</text><text x="16" y="1680" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">not a real measuring tool.</text><text x="16" y="1721" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536963">Real pouring and reading can be</text><text x="16" y="1744" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536963">uncertain. This model omits splashes,</text><text x="16" y="1767" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536963">liquid left on surfaces and the</text><text x="16" y="1790" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536963">curved liquid surface.</text><rect x="16" y="1828" width="177" height="48" rx="8" fill="#fffdf5" stroke="#81958b"/><text x="28" y="1858" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">Hear this view</text><rect x="16" y="1900" width="288" height="48" rx="8" fill="#fffdf5" stroke="#81958b"/><text x="28" y="1930" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">Tenths Table</text><rect x="16" y="1956" width="288" height="48" rx="8" fill="#fffdf5" stroke="#81958b"/><text x="28" y="1986" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">Hundredths Bridge</text><rect x="16" y="2012" width="288" height="48" rx="8" fill="#fffdf5" stroke="#81958b"/><text x="28" y="2042" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">Grown-up notes</text></svg>