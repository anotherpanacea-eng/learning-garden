<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1900" viewBox="0 0 320 1900" role="img" aria-labelledby="title desc"><title id="title">Same pour, new unit, 320 pixel design</title><desc id="desc">Supplied example, 350 milliliters equals 0.35 liters in a one-liter capacity jug with twenty equal fifty-milliliter intervals. Seven spaces reach the level. Reserve is 650 milliliters. L selected. All writing and art original.</desc><rect width="320" height="1900" fill="#f6f0df"/><text x="16" y="30" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#255b4d">← Back to Measuring Kitchen</text><text x="16" y="69" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#283f3b">Same pour,</text><text x="16" y="105" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#283f3b">new unit</text><text x="16" y="126" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">Read a recipe and a jug when</text><text x="16" y="149" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">their labels use different units.</text><rect x="16" y="174" width="288" height="72" rx="12" fill="#e6ebd9" stroke="#81958b"/><text x="30" y="199" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#283f3b">Supplied recipe label:</text><text x="30" y="223" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#283f3b">0.35&#160;L = 350&#160;mL.</text><text x="16" y="270" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">1&#160;L = 1000&#160;mL. A milliliter is</text><text x="16" y="293" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">the smaller unit, so the same</text><text x="16" y="316" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">amount needs more milliliters</text><text x="16" y="339" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">than liters.</text><text x="16" y="372" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#283f3b">Change the unit label:</text><text x="16" y="395" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">the liquid stays still.</text><rect x="16" y="409" width="112" height="48" rx="8" fill="#fffdf5" stroke="#81958b"/><text x="28" y="439" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">mL</text><rect x="140" y="409" width="140" height="48" rx="8" fill="#255b4d" stroke="#255b4d"/><text x="152" y="439" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#fffdf5">L  ✓ Selected</text><rect x="16" y="476" width="288" height="500" rx="12" fill="#fffdf5" stroke="#81958b"/><text x="32" y="506" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#283f3b">Jug scale:&#160;L (liters)</text><path d="M243 611h22q35 0 35 38v65q0 35-35 35h-22" fill="none" stroke="#81958b" stroke-width="7"/><rect x="131" y="755" width="108" height="91" fill="#b1d7d2"/><path d="M134 839h100" stroke="#80b2ab" stroke-width="1"/><path d="M134 826h100" stroke="#80b2ab" stroke-width="1"/><path d="M134 813h100" stroke="#80b2ab" stroke-width="1"/><path d="M134 800h100" stroke="#80b2ab" stroke-width="1"/><path d="M134 787h100" stroke="#80b2ab" stroke-width="1"/><path d="M134 774h100" stroke="#80b2ab" stroke-width="1"/><path d="M131 586v260h108v-260" fill="none" stroke="#283f3b" stroke-width="3"/><path d="M131 755h108" stroke="#255b4d" stroke-width="3"/><path d="M128 846h-15" stroke="#283f3b" stroke-width="1.5"/><text x="71" y="851" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#283f3b">0.0</text><path d="M128 833h-9" stroke="#283f3b" stroke-width="1.5"/><path d="M128 820h-15" stroke="#283f3b" stroke-width="1.5"/><text x="71" y="825" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#283f3b">0.1</text><path d="M128 807h-9" stroke="#283f3b" stroke-width="1.5"/><path d="M128 794h-15" stroke="#283f3b" stroke-width="1.5"/><text x="71" y="799" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#283f3b">0.2</text><path d="M128 781h-9" stroke="#283f3b" stroke-width="1.5"/><path d="M128 768h-15" stroke="#283f3b" stroke-width="1.5"/><text x="71" y="773" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#283f3b">0.3</text><path d="M128 755h-9" stroke="#283f3b" stroke-width="1.5"/><path d="M128 742h-15" stroke="#283f3b" stroke-width="1.5"/><text x="71" y="747" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#283f3b">0.4</text><path d="M128 729h-9" stroke="#283f3b" stroke-width="1.5"/><path d="M128 716h-15" stroke="#283f3b" stroke-width="1.5"/><text x="71" y="721" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#283f3b">0.5</text><path d="M128 703h-9" stroke="#283f3b" stroke-width="1.5"/><path d="M128 690h-15" stroke="#283f3b" stroke-width="1.5"/><text x="71" y="695" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#283f3b">0.6</text><path d="M128 677h-9" stroke="#283f3b" stroke-width="1.5"/><path d="M128 664h-15" stroke="#283f3b" stroke-width="1.5"/><text x="71" y="669" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#283f3b">0.7</text><path d="M128 651h-9" stroke="#283f3b" stroke-width="1.5"/><path d="M128 638h-15" stroke="#283f3b" stroke-width="1.5"/><text x="71" y="643" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#283f3b">0.8</text><path d="M128 625h-9" stroke="#283f3b" stroke-width="1.5"/><path d="M128 612h-15" stroke="#283f3b" stroke-width="1.5"/><text x="71" y="617" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#283f3b">0.9</text><path d="M128 599h-9" stroke="#283f3b" stroke-width="1.5"/><path d="M128 586h-15" stroke="#283f3b" stroke-width="1.5"/><text x="71" y="591" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#283f3b">1.0</text><path d="M241 755h18" stroke="#255b4d" stroke-width="2"/><text x="32" y="538" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#283f3b">Jug capacity: 1&#160;L = 1000&#160;mL.</text><text x="32" y="561" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#536963">The most this jug can hold.</text><text x="32" y="884" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#283f3b">20 equal small spaces; 21 marks.</text><text x="32" y="906" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#283f3b">Each small space:</text><text x="32" y="928" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#283f3b">50&#160;mL = 0.05&#160;L.</text><text x="32" y="950" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#283f3b">Count spaces from zero, not marks.</text><text x="16" y="1003" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#283f3b">In the jug:</text><text x="16" y="1028" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#283f3b">350&#160;mL = 0.35&#160;L.</text><text x="16" y="1053" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#283f3b">7 small spaces reach</text><text x="16" y="1078" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#283f3b">the liquid level.</text><text x="16" y="1117" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">Reserve: 650&#160;mL.</text><text x="16" y="1140" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">Jug + reserve = 1000&#160;mL.</text><text x="16" y="1186" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#283f3b">Move one 50&#160;mL measure:</text><text x="16" y="1209" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#283f3b">the liquid level changes.</text><rect x="16" y="1226" width="134" height="48" rx="8" fill="#eee8d8" stroke="#81958b"/><text x="28" y="1256" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536963">Add 50&#160;mL</text><rect x="160" y="1226" width="144" height="48" rx="8" fill="#fffdf5" stroke="#81958b"/><text x="172" y="1256" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">Return 50&#160;mL</text><text x="16" y="1300" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">This example moves between</text><text x="16" y="1323" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">300&#160;mL and 350&#160;mL.</text><rect x="16" y="1333" width="230" height="48" rx="8" fill="#fffdf5" stroke="#81958b"/><text x="28" y="1363" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">Undo last change</text><text x="16" y="1407" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#255b4d">50&#160;mL moved from reserve to jug.</text><text x="16" y="1430" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#255b4d">In the jug: 350&#160;mL = 0.35&#160;L.</text><text x="16" y="1475" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">Pretend liquid, exact picture amounts.</text><text x="16" y="1498" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">This straight-sided jug is a model,</text><text x="16" y="1521" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">not a real measuring tool.</text><text x="16" y="1562" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#536963">Real pouring and reading can be</text><text x="16" y="1584" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#536963">uncertain. This model omits splashes,</text><text x="16" y="1606" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#536963">liquid left on surfaces and the</text><text x="16" y="1628" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#536963">curved liquid surface.</text><rect x="16" y="1669" width="177" height="48" rx="8" fill="#fffdf5" stroke="#81958b"/><text x="28" y="1699" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">Hear this view</text><text x="16" y="1752" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#255b4d">Tenths Table · Hundredths Bridge</text><text x="16" y="1774" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#255b4d">Grown-up notes</text></svg>