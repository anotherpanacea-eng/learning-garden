<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1220" viewBox="0 0 820 1220" role="img" aria-labelledby="title desc"><title id="title">Same pour, new unit, 820 pixel design</title><desc id="desc">Supplied example, 350 milliliters equals 0.35 liters in a one-liter capacity jug with twenty equal fifty-milliliter intervals. Seven spaces reach the level. Reserve is 650 milliliters. L selected. All writing and art original.</desc><rect width="820" height="1220" fill="#f6f0df"/><text x="32" y="30" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#255b4d">← Back to Measuring Kitchen</text><text x="32" y="69" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#283f3b">Same pour, new unit</text><text x="32" y="104" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">Read a recipe and a jug when their labels use different units.</text><rect x="32" y="132" width="756" height="58" rx="12" fill="#e6ebd9" stroke="#81958b"/><text x="46" y="157" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#283f3b">Supplied recipe label: 0.35&#160;L = 350&#160;mL.</text><text x="32" y="218" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">1&#160;L = 1000&#160;mL. A milliliter is the smaller unit, so the same amount</text><text x="32" y="241" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">needs more milliliters than liters.</text><text x="32" y="278" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#283f3b">Change the unit label:</text><text x="32" y="301" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">the liquid stays still.</text><rect x="32" y="315" width="112" height="48" rx="8" fill="#fffdf5" stroke="#81958b"/><text x="44" y="345" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">mL</text><rect x="156" y="315" width="140" height="48" rx="8" fill="#255b4d" stroke="#255b4d"/><text x="168" y="345" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#fffdf5">L  ✓ Selected</text><rect x="32" y="382" width="370" height="500" rx="12" fill="#fffdf5" stroke="#81958b"/><text x="48" y="412" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#283f3b">Jug scale:&#160;L (liters)</text><path d="M259 517h22q35 0 35 38v65q0 35-35 35h-22" fill="none" stroke="#81958b" stroke-width="7"/><rect x="147" y="661" width="108" height="91" fill="#b1d7d2"/><path d="M150 745h100" stroke="#80b2ab" stroke-width="1"/><path d="M150 732h100" stroke="#80b2ab" stroke-width="1"/><path d="M150 719h100" stroke="#80b2ab" stroke-width="1"/><path d="M150 706h100" stroke="#80b2ab" stroke-width="1"/><path d="M150 693h100" stroke="#80b2ab" stroke-width="1"/><path d="M150 680h100" stroke="#80b2ab" stroke-width="1"/><path d="M147 492v260h108v-260" fill="none" stroke="#283f3b" stroke-width="3"/><path d="M147 661h108" stroke="#255b4d" stroke-width="3"/><path d="M144 752h-15" stroke="#283f3b" stroke-width="1.5"/><text x="87" y="757" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#283f3b">0.0</text><path d="M144 739h-9" stroke="#283f3b" stroke-width="1.5"/><path d="M144 726h-15" stroke="#283f3b" stroke-width="1.5"/><text x="87" y="731" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#283f3b">0.1</text><path d="M144 713h-9" stroke="#283f3b" stroke-width="1.5"/><path d="M144 700h-15" stroke="#283f3b" stroke-width="1.5"/><text x="87" y="705" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#283f3b">0.2</text><path d="M144 687h-9" stroke="#283f3b" stroke-width="1.5"/><path d="M144 674h-15" stroke="#283f3b" stroke-width="1.5"/><text x="87" y="679" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#283f3b">0.3</text><path d="M144 661h-9" stroke="#283f3b" stroke-width="1.5"/><path d="M144 648h-15" stroke="#283f3b" stroke-width="1.5"/><text x="87" y="653" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#283f3b">0.4</text><path d="M144 635h-9" stroke="#283f3b" stroke-width="1.5"/><path d="M144 622h-15" stroke="#283f3b" stroke-width="1.5"/><text x="87" y="627" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#283f3b">0.5</text><path d="M144 609h-9" stroke="#283f3b" stroke-width="1.5"/><path d="M144 596h-15" stroke="#283f3b" stroke-width="1.5"/><text x="87" y="601" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#283f3b">0.6</text><path d="M144 583h-9" stroke="#283f3b" stroke-width="1.5"/><path d="M144 570h-15" stroke="#283f3b" stroke-width="1.5"/><text x="87" y="575" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#283f3b">0.7</text><path d="M144 557h-9" stroke="#283f3b" stroke-width="1.5"/><path d="M144 544h-15" stroke="#283f3b" stroke-width="1.5"/><text x="87" y="549" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#283f3b">0.8</text><path d="M144 531h-9" stroke="#283f3b" stroke-width="1.5"/><path d="M144 518h-15" stroke="#283f3b" stroke-width="1.5"/><text x="87" y="523" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#283f3b">0.9</text><path d="M144 505h-9" stroke="#283f3b" stroke-width="1.5"/><path d="M144 492h-15" stroke="#283f3b" stroke-width="1.5"/><text x="87" y="497" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#283f3b">1.0</text><path d="M257 661h18" stroke="#255b4d" stroke-width="2"/><text x="48" y="444" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#283f3b">Jug capacity: 1&#160;L = 1000&#160;mL.</text><text x="48" y="467" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#536963">The most this jug can hold.</text><text x="48" y="790" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#283f3b">20 equal small spaces; 21 marks.</text><text x="48" y="812" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#283f3b">Each small space:</text><text x="48" y="834" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#283f3b">50&#160;mL = 0.05&#160;L.</text><text x="48" y="856" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#283f3b">Count spaces from zero, not marks.</text><rect x="418" y="382" width="370" height="500" rx="12" fill="#f1ead7" stroke="#81958b"/><text x="434" y="414" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#283f3b">In the jug:</text><text x="434" y="439" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#283f3b">350&#160;mL = 0.35&#160;L.</text><text x="434" y="464" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#283f3b">7 small spaces reach</text><text x="434" y="489" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#283f3b">the liquid level.</text><text x="434" y="528" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">Reserve: 650&#160;mL.</text><text x="434" y="551" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">Jug + reserve = 1000&#160;mL.</text><text x="434" y="597" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#283f3b">Move one 50&#160;mL measure:</text><text x="434" y="620" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#283f3b">the liquid level changes.</text><rect x="434" y="637" width="145" height="48" rx="8" fill="#eee8d8" stroke="#81958b"/><text x="446" y="667" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536963">Add 50&#160;mL</text><rect x="591" y="637" width="177" height="48" rx="8" fill="#fffdf5" stroke="#81958b"/><text x="603" y="667" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">Return 50&#160;mL</text><text x="434" y="711" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">This example moves between</text><text x="434" y="734" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">300&#160;mL and 350&#160;mL.</text><rect x="434" y="744" width="230" height="48" rx="8" fill="#fffdf5" stroke="#81958b"/><text x="446" y="774" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">Undo last change</text><text x="32" y="917" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#255b4d">50&#160;mL moved from reserve to jug. In the jug: 350&#160;mL = 0.35&#160;L.</text><text x="32" y="961" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">Pretend liquid, exact picture amounts.</text><text x="32" y="984" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">This straight-sided jug is a model, not a real measuring tool.</text><text x="32" y="1021" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#536963">Real pouring and reading can be uncertain. This model omits splashes,</text><text x="32" y="1043" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#536963">liquid left on surfaces and the curved liquid surface.</text><rect x="32" y="1087" width="177" height="48" rx="8" fill="#fffdf5" stroke="#81958b"/><text x="44" y="1117" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">Hear this view</text><text x="32" y="1170" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#255b4d">Tenths Table · Hundredths Bridge · Grown-up notes</text></svg>