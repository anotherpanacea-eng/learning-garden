<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1309" viewBox="0 0 820 1309" role="img" aria-labelledby="title desc"><title id="title">Same pour, new unit, 820 pixel design</title><desc id="desc">Supplied example. In the jug: three hundred fifty milliliters equals zero point three five liters. Jug capacity: one liter equals one thousand milliliters. 20 equal small spaces; 21 marks. Each space is fifty milliliters, or zero point zero five liters. Seven spaces reach the level. Reserve outside the jug: six hundred fifty milliliters. The empty space inside the jug is not reserve liquid. Scale selected: liters. All writing and art original.</desc><rect width="820" height="1309" fill="#f6f0df"/><rect x="32" y="12" width="300" height="48" rx="8" fill="#fffdf5" stroke="#81958b"/><text x="44" y="42" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">← Back to Measuring Kitchen</text><text x="32" y="98" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#283f3b">Same pour, new unit</text><text x="32" y="134" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">Read a recipe and a jug when their labels use different units.</text><rect x="32" y="162" width="756" height="58" rx="12" fill="#e6ebd9" stroke="#81958b"/><text x="46" y="187" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#283f3b">Supplied recipe label: 0.35&#160;L = 350&#160;mL.</text><text x="32" y="248" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">1&#160;L = 1000&#160;mL. A milliliter is the smaller unit, so the same amount</text><text x="32" y="271" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">needs more milliliters than liters.</text><text x="32" y="308" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#283f3b">Change the unit label:</text><text x="32" y="331" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">the liquid stays still.</text><rect x="32" y="345" width="112" height="48" rx="8" fill="#fffdf5" stroke="#81958b"/><text x="44" y="375" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">mL</text><rect x="156" y="345" width="140" height="48" rx="8" fill="#255b4d" stroke="#255b4d"/><text x="168" y="375" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#fffdf5">L  ✓ Selected</text><rect x="32" y="412" width="370" height="540" rx="12" fill="#fffdf5" stroke="#81958b"/><text x="48" y="442" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#283f3b">Jug scale:&#160;L (liters)</text><path d="M259 547h22q35 0 35 38v65q0 35-35 35h-22" fill="none" stroke="#81958b" stroke-width="7"/><rect x="147" y="691" width="108" height="91" fill="#b1d7d2"/><path d="M147 522v260h108v-260" fill="none" stroke="#283f3b" stroke-width="3"/><path d="M147 691h108" stroke="#255b4d" stroke-width="3"/><path d="M144 782h-15" stroke="#283f3b" stroke-width="1.5"/><text x="87" y="787" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">0.0</text><path d="M144 769h-9" stroke="#283f3b" stroke-width="1.5"/><path d="M144 756h-15" stroke="#283f3b" stroke-width="1.5"/><text x="87" y="761" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">0.1</text><path d="M144 743h-9" stroke="#283f3b" stroke-width="1.5"/><path d="M144 730h-15" stroke="#283f3b" stroke-width="1.5"/><text x="87" y="735" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">0.2</text><path d="M144 717h-9" stroke="#283f3b" stroke-width="1.5"/><path d="M144 704h-15" stroke="#283f3b" stroke-width="1.5"/><text x="87" y="709" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">0.3</text><path d="M144 691h-9" stroke="#283f3b" stroke-width="1.5"/><path d="M144 678h-15" stroke="#283f3b" stroke-width="1.5"/><text x="87" y="683" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">0.4</text><path d="M144 665h-9" stroke="#283f3b" stroke-width="1.5"/><path d="M144 652h-15" stroke="#283f3b" stroke-width="1.5"/><text x="87" y="657" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">0.5</text><path d="M144 639h-9" stroke="#283f3b" stroke-width="1.5"/><path d="M144 626h-15" stroke="#283f3b" stroke-width="1.5"/><text x="87" y="631" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">0.6</text><path d="M144 613h-9" stroke="#283f3b" stroke-width="1.5"/><path d="M144 600h-15" stroke="#283f3b" stroke-width="1.5"/><text x="87" y="605" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">0.7</text><path d="M144 587h-9" stroke="#283f3b" stroke-width="1.5"/><path d="M144 574h-15" stroke="#283f3b" stroke-width="1.5"/><text x="87" y="579" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">0.8</text><path d="M144 561h-9" stroke="#283f3b" stroke-width="1.5"/><path d="M144 548h-15" stroke="#283f3b" stroke-width="1.5"/><text x="87" y="553" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">0.9</text><path d="M144 535h-9" stroke="#283f3b" stroke-width="1.5"/><path d="M144 522h-15" stroke="#283f3b" stroke-width="1.5"/><text x="87" y="527" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">1.0</text><path d="M257 691h18" stroke="#255b4d" stroke-width="2"/><text x="48" y="474" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#283f3b">Jug capacity: 1&#160;L = 1000&#160;mL.</text><text x="48" y="497" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536963">The most this jug can hold.</text><text x="48" y="820" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">20 equal small spaces; 21 marks.</text><text x="48" y="843" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">Each small space:</text><text x="48" y="866" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">50&#160;mL = 0.05&#160;L.</text><text x="48" y="889" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">Count spaces from zero, not marks.</text><rect x="418" y="412" width="370" height="540" rx="12" fill="#f1ead7" stroke="#81958b"/><text x="434" y="444" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#283f3b">In the jug:</text><text x="434" y="469" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#283f3b">350&#160;mL = 0.35&#160;L.</text><text x="434" y="494" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#283f3b">7 small spaces reach</text><text x="434" y="519" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#283f3b">the liquid level.</text><text x="434" y="558" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">Reserve outside the jug:</text><text x="434" y="581" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">650&#160;mL.</text><text x="434" y="615" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">The empty space inside the jug</text><text x="434" y="638" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">is not reserve liquid.</text><text x="434" y="672" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">Jug + reserve = 1000&#160;mL.</text><text x="434" y="717" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#283f3b">Move one 50&#160;mL measure:</text><text x="434" y="740" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#283f3b">the liquid level changes.</text><rect x="434" y="757" width="145" height="48" rx="8" fill="#eee8d8" stroke="#81958b"/><text x="446" y="787" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536963">Add 50&#160;mL</text><rect x="591" y="757" width="177" height="48" rx="8" fill="#fffdf5" stroke="#81958b"/><text x="603" y="787" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">Return 50&#160;mL</text><text x="434" y="831" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">This example moves between</text><text x="434" y="854" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">300&#160;mL and 350&#160;mL.</text><rect x="434" y="864" width="230" height="48" rx="8" fill="#fffdf5" stroke="#81958b"/><text x="446" y="894" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">Undo last change</text><text x="32" y="987" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#255b4d">50&#160;mL moved from reserve to jug. In the jug: 350&#160;mL = 0.35&#160;L.</text><text x="32" y="1031" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">Pretend liquid, exact picture amounts.</text><text x="32" y="1054" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">This straight-sided jug is a model, not a real measuring tool.</text><text x="32" y="1091" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536963">Real pouring and reading can be uncertain. This model omits splashes,</text><text x="32" y="1114" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536963">liquid left on surfaces and the curved liquid surface.</text><rect x="32" y="1157" width="177" height="48" rx="8" fill="#fffdf5" stroke="#81958b"/><text x="44" y="1187" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">Hear this view</text><rect x="32" y="1229" width="234" height="48" rx="8" fill="#fffdf5" stroke="#81958b"/><text x="44" y="1259" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">Tenths Table</text><rect x="282" y="1229" width="234" height="48" rx="8" fill="#fffdf5" stroke="#81958b"/><text x="294" y="1259" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">Hundredths Bridge</text><rect x="532" y="1229" width="234" height="48" rx="8" fill="#fffdf5" stroke="#81958b"/><text x="544" y="1259" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#283f3b">Grown-up notes</text></svg>