<svg xmlns="http://www.w3.org/2000/svg" width="820" height="960" viewBox="0 0 820 960" role="img" aria-labelledby="title"><title id="title">Optional starting choices, original 820px static design</title><rect width="820" height="960" fill="#f7faf7"/><text x="32" y="32" font-family="Trebuchet MS,Verdana,sans-serif" font-size="20" font-weight="700" fill="#283f3b">After the Storm</text><path d="M780 34v-17q-15-10-17 0q2 11 17 12q15-3 15-14q-12-2-15 6" fill="#e6ebd9" stroke="#255b4d" stroke-width="2"/><text x="32" y="65" font-family="Trebuchet MS,Verdana,sans-serif" font-size="18" font-weight="700" fill="#283f3b">How shall we begin?</text><rect x="32" y="94" width="180" height="48" rx="9" fill="#fffdf5" stroke="#81958b"/><text x="44" y="123" font-family="Trebuchet MS,Verdana,sans-serif" font-size="16" font-weight="400" fill="#283f3b">Math</text><rect x="224" y="94" width="180" height="48" rx="9" fill="#fffdf5" stroke="#81958b"/><text x="236" y="123" font-family="Trebuchet MS,Verdana,sans-serif" font-size="16" font-weight="400" fill="#283f3b">Reading</text><rect x="416" y="94" width="180" height="48" rx="9" fill="#fffdf5" stroke="#81958b"/><text x="428" y="123" font-family="Trebuchet MS,Verdana,sans-serif" font-size="16" font-weight="400" fill="#283f3b">French</text><rect x="608" y="94" width="180" height="48" rx="9" fill="#255b4d" stroke="#81958b"/><text x="620" y="123" font-family="Trebuchet MS,Verdana,sans-serif" font-size="16" font-weight="700" fill="#fffdf5">Begin ✓</text><text x="32" y="198" font-family="Trebuchet MS,Verdana,sans-serif" font-size="30" font-weight="700" fill="#283f3b">Choose your first errand</text><text x="32" y="242" font-family="Trebuchet MS,Verdana,sans-serif" font-size="16" font-weight="400" fill="#283f3b">These choices are for future orders and new reading visits.</text><text x="32" y="266" font-family="Trebuchet MS,Verdana,sans-serif" font-size="16" font-weight="400" fill="#283f3b">Anything waiting keeps its own numbers and pages.</text><rect x="550" y="302" width="238" height="294" rx="9" fill="#e6ebd9" stroke="#81958b"/><text x="566" y="335" font-family="Trebuchet MS,Verdana,sans-serif" font-size="18" font-weight="700" fill="#283f3b">Your choices</text><text x="566" y="379" font-family="Trebuchet MS,Verdana,sans-serif" font-size="16" font-weight="700" fill="#283f3b">Café math</text><text x="566" y="403" font-family="Trebuchet MS,Verdana,sans-serif" font-size="16" font-weight="700" fill="#283f3b">Smaller orders</text><text x="566" y="451" font-family="Trebuchet MS,Verdana,sans-serif" font-size="16" font-weight="700" fill="#283f3b">English reading</text><text x="566" y="475" font-family="Trebuchet MS,Verdana,sans-serif" font-size="16" font-weight="700" fill="#283f3b">A longer passage</text><text x="566" y="523" font-family="Trebuchet MS,Verdana,sans-serif" font-size="16" font-weight="700" fill="#283f3b">French</text><text x="566" y="547" font-family="Trebuchet MS,Verdana,sans-serif" font-size="16" font-weight="700" fill="#283f3b">Short sentences</text><rect x="32" y="302" width="494" height="84" rx="9" fill="#fffdf5" stroke="#81958b"/><text x="44" y="331" font-family="Trebuchet MS,Verdana,sans-serif" font-size="16" font-weight="400" fill="#283f3b">Go to the Café</text><text x="44" y="359" font-family="Trebuchet MS,Verdana,sans-serif" font-size="16" font-weight="400" fill="#283f3b">Feed a waiting neighbor.</text><rect x="32" y="400" width="494" height="84" rx="9" fill="#fffdf5" stroke="#81958b"/><text x="44" y="429" font-family="Trebuchet MS,Verdana,sans-serif" font-size="16" font-weight="400" fill="#283f3b">Read in Paris</text><text x="44" y="457" font-family="Trebuchet MS,Verdana,sans-serif" font-size="16" font-weight="400" fill="#283f3b">Follow a story and a clue.</text><rect x="32" y="498" width="494" height="84" rx="9" fill="#fffdf5" stroke="#81958b"/><text x="44" y="527" font-family="Trebuchet MS,Verdana,sans-serif" font-size="16" font-weight="400" fill="#283f3b">Explore Paris in French</text><text x="44" y="555" font-family="Trebuchet MS,Verdana,sans-serif" font-size="16" font-weight="400" fill="#283f3b">Read a little French together.</text><rect x="32" y="596" width="494" height="84" rx="9" fill="#fffdf5" stroke="#81958b"/><text x="44" y="625" font-family="Trebuchet MS,Verdana,sans-serif" font-size="16" font-weight="400" fill="#283f3b">Choose another place</text><text x="44" y="653" font-family="Trebuchet MS,Verdana,sans-serif" font-size="16" font-weight="400" fill="#283f3b">Keep every destination open.</text><text x="32" y="728" font-family="Trebuchet MS,Verdana,sans-serif" font-size="16" font-weight="400" fill="#283f3b">Choices are separate for this explorer. No level is assigned.</text><rect x="32" y="760" width="238" height="48" rx="9" fill="#fffdf5" stroke="#81958b"/><text x="44" y="789" font-family="Trebuchet MS,Verdana,sans-serif" font-size="16" font-weight="400" fill="#283f3b">Back: French</text><rect x="286" y="760" width="238" height="48" rx="9" fill="#fffdf5" stroke="#81958b"/><text x="298" y="789" font-family="Trebuchet MS,Verdana,sans-serif" font-size="16" font-weight="400" fill="#283f3b">Hear this page</text><rect x="32" y="830" width="494" height="48" rx="9" fill="#fffdf5" stroke="#81958b"/><text x="44" y="859" font-family="Trebuchet MS,Verdana,sans-serif" font-size="16" font-weight="400" fill="#283f3b">Skip and go Home</text></svg>