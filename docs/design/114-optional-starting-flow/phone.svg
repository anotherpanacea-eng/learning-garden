<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1040" viewBox="0 0 320 1040" role="img" aria-labelledby="title"><title id="title">Optional starting choices, original 320px static design</title><rect width="320" height="1040" fill="#f7faf7"/><text x="16" y="32" font-family="Trebuchet MS,Verdana,sans-serif" font-size="20" font-weight="700" fill="#283f3b">After the Storm</text><path d="M280 34v-17q-15-10-17 0q2 11 17 12q15-3 15-14q-12-2-15 6" fill="#e6ebd9" stroke="#255b4d" stroke-width="2"/><text x="16" y="65" font-family="Trebuchet MS,Verdana,sans-serif" font-size="18" font-weight="700" fill="#283f3b">How shall we begin?</text><rect x="16" y="92" width="140" height="48" rx="9" fill="#255b4d" stroke="#81958b"/><text x="28" y="121" font-family="Trebuchet MS,Verdana,sans-serif" font-size="16" font-weight="700" fill="#fffdf5">Math</text><rect x="164" y="92" width="140" height="48" rx="9" fill="#fffdf5" stroke="#81958b"/><text x="176" y="121" font-family="Trebuchet MS,Verdana,sans-serif" font-size="16" font-weight="400" fill="#283f3b">Reading</text><rect x="16" y="148" width="140" height="48" rx="9" fill="#fffdf5" stroke="#81958b"/><text x="28" y="177" font-family="Trebuchet MS,Verdana,sans-serif" font-size="16" font-weight="400" fill="#283f3b">French</text><rect x="164" y="148" width="140" height="48" rx="9" fill="#fffdf5" stroke="#81958b"/><text x="176" y="177" font-family="Trebuchet MS,Verdana,sans-serif" font-size="16" font-weight="400" fill="#283f3b">Begin</text><text x="16" y="251" font-family="Trebuchet MS,Verdana,sans-serif" font-size="28" font-weight="700" fill="#283f3b">What numbers shall</text><text x="16" y="287" font-family="Trebuchet MS,Verdana,sans-serif" font-size="28" font-weight="700" fill="#283f3b">we start with?</text><text x="16" y="338" font-family="Trebuchet MS,Verdana,sans-serif" font-size="16" font-weight="400" fill="#283f3b">These choices are for new Café</text><text x="16" y="362" font-family="Trebuchet MS,Verdana,sans-serif" font-size="16" font-weight="400" fill="#283f3b">orders. Other math places keep</text><text x="16" y="386" font-family="Trebuchet MS,Verdana,sans-serif" font-size="16" font-weight="400" fill="#283f3b">their own choices.</text><text x="16" y="423" font-family="Trebuchet MS,Verdana,sans-serif" font-size="18" font-weight="700" fill="#283f3b">Choose a starting amount:</text><rect x="16" y="444" width="288" height="84" rx="9" fill="#255b4d" stroke="#81958b"/><text x="28" y="473" font-family="Trebuchet MS,Verdana,sans-serif" font-size="16" font-weight="700" fill="#fffdf5">✓ Keep my Café choice</text><text x="28" y="501" font-family="Trebuchet MS,Verdana,sans-serif" font-size="16" font-weight="400" fill="#fffdf5">Use the existing Café choice.</text><rect x="16" y="540" width="288" height="84" rx="9" fill="#fffdf5" stroke="#81958b"/><text x="28" y="569" font-family="Trebuchet MS,Verdana,sans-serif" font-size="16" font-weight="400" fill="#283f3b">Smaller orders</text><text x="28" y="597" font-family="Trebuchet MS,Verdana,sans-serif" font-size="16" font-weight="400" fill="#283f3b">2–4 guests; 2–3 bites each.</text><rect x="16" y="636" width="288" height="84" rx="9" fill="#fffdf5" stroke="#81958b"/><text x="28" y="665" font-family="Trebuchet MS,Verdana,sans-serif" font-size="16" font-weight="400" fill="#283f3b">All multiplication facts</text><text x="28" y="693" font-family="Trebuchet MS,Verdana,sans-serif" font-size="16" font-weight="400" fill="#283f3b">1–12 guests and bites.</text><text x="16" y="757" font-family="Trebuchet MS,Verdana,sans-serif" font-size="16" font-weight="400" fill="#283f3b">You can choose a different</text><text x="16" y="781" font-family="Trebuchet MS,Verdana,sans-serif" font-size="16" font-weight="400" fill="#283f3b">amount inside each activity.</text><rect x="16" y="802" width="288" height="48" rx="9" fill="#fffdf5" stroke="#81958b"/><text x="28" y="831" font-family="Trebuchet MS,Verdana,sans-serif" font-size="16" font-weight="400" fill="#283f3b">Next: Reading</text><rect x="16" y="866" width="288" height="48" rx="9" fill="#fffdf5" stroke="#81958b"/><text x="28" y="895" font-family="Trebuchet MS,Verdana,sans-serif" font-size="16" font-weight="400" fill="#283f3b">Hear this page</text><rect x="16" y="930" width="288" height="48" rx="9" fill="#fffdf5" stroke="#81958b"/><text x="28" y="959" font-family="Trebuchet MS,Verdana,sans-serif" font-size="16" font-weight="400" fill="#283f3b">Skip choices and explore</text></svg>