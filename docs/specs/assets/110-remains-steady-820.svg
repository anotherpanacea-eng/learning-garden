<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1108" viewBox="0 0 820 1108" role="img" aria-labelledby="title desc"><title id="title">Write what remains — steady at 820</title><desc id="desc">Original static design: 42 counters across the table and store tray; group counts before returning are separate from result digits. The supplied written remainder is 30.</desc><rect width="100%" height="100%" fill="#f7faf5"/><text x="24" y="26" font-size="14" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">Learning Garden · original design sample</text><text x="24" y="57" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">‹ Return to the returning table</text><text x="24" y="99" font-size="34" font-family="Georgia,serif" font-weight="normal" fill="#183f39">Write what remains</text><text x="24" y="127" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">One supplied ones-first strategy</text><rect x="24" y="145" width="772" height="58" rx="5" fill="#eef5e9" stroke="#7d987d"/><text x="36" y="169" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Start: 42 counters.</text><text x="36" y="191" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Return 12: one ten and two ones.</text><text x="24" y="231" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">▸ Read the original return request</text><rect x="24" y="252" width="381.0" height="44" rx="8" fill="#fffdf5" stroke="#b5c8b4"/><text x="42" y="280" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Picture</text><rect x="415.0" y="252" width="381.0" height="44" rx="8" fill="#183f39" stroke="#183f39"/><text x="433.0" y="280" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#fffdf5">Write</text><text x="24" y="327" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">This fresh writing picture starts again when you leave. Earlier returning work is</text><text x="24" y="349" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">kept.</text><text x="24" y="383" font-size="22" font-family="Georgia,serif" font-weight="normal" fill="#183f39">The same 42 counters</text><rect x="24" y="401" width="340" height="105" rx="8" fill="#eef5e9" stroke="#7d987d"/><text x="34" y="425" font-size="17" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Pip&#x27;s table</text><text x="34" y="448" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">3 tens · 0 ones</text><rect x="34" y="460" width="58" height="33" rx="5" fill="#f8f7e9" stroke="#7d987d"/><rect x="40" y="466" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="49" y="466" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="58" y="466" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="67" y="466" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="76" y="466" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="40" y="477" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="49" y="477" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="58" y="477" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="67" y="477" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="76" y="477" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="99" y="460" width="58" height="33" rx="5" fill="#f8f7e9" stroke="#7d987d"/><rect x="105" y="466" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="114" y="466" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="123" y