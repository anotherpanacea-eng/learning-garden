="5" fill="#eef4f8" stroke="#4f748f"/><rect x="40" y="583" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="49" y="583" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="58" y="583" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="67" y="583" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="76" y="583" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="40" y="594" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="49" y="594" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="58" y="594" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="67" y="594" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="76" y="594" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="36" y="620" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="51" y="620" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><text x="24" y="668" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Together: 42 counters.</text><text x="24" y="697" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">Four tens minus the returned ten</text><text x="24" y="719" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">leaves three tens. The table&#x27;s three</text><text x="24" y="741" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">tens and zero ones read 30. Together</text><text x="24" y="763" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">with the store tray, all 42 counters</text><text x="24" y="785" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">are still here.</text><text x="388" y="383" font-size="22" font-family="Georgia,serif" font-weight="normal" fill="#183f39">Working groups</text><text x="388" y="407" font-size="18" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">before returning</text><rect x="388" y="422" width="408" height="64" rx="5" fill="#fff0c8" stroke="#c6a46c"/><text x="398" y="446" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">Use the original 4 tens and 2 ones.</text><text x="398" y="468" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">No ten needs opening.</text><rect x="388" y="503" width="408" height="114" rx="0" fill="#fffdf5" stroke="#9bb8a8"/><path d="M388 533h408" stroke="#9bb8a8"/><path d="M388 575h408" stroke="#9bb8a8"/><path d="M474 503v114" stroke="#9bb8a8"/><path d="M635.0 503v114" stroke="#9bb8a8"/><text x="482" y="524" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Tens</text><text x="643.0" y="524" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Ones</text><text x="397" y="560" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Use</text><text x="397" y="603" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">− Return</text><text x="546.5" y="564" font-size="28" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">4</text><text x="707.5" y="564" font-size="28" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">2</text><text x="546.5" y="607" font-size="28" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">1</text><text x="707.5" y="607" font-size="28" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">2</text><text x="388" y="648" font-size="20" font-family="Georgia,serif" font-weight="normal" fill="#183f39">Digits left on the table</text><rect x="388" y="666" width="408" height="48" rx="0" fill="#eef5e9" stroke="#7d987d"/><path d="M474 666v48" stroke="#9bb8a8"/><path d="M635.0 666v48" stroke="#9bb8a8"/><text x="397" y="697" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Left</text><text x="546.5" y="700" font-size="28" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">3</text><text x="707.5" y="700" font-size="28" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">0</text><text x="388" y="744" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Supplied writing: 42 − 12 = 30.</text><rect x="388.0" y="774" width="199.0" height="72" rx="6" fill="#edf1e9" stroke="#a9b9ac"/><text x="398.0" y="798" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#5b7065">Place the ones digit</text><text x="398.0" y="818" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#5b7065">from this picture</text><rect x="597.0" y="774" width="199.0" height="72" rx="6" fill="#edf1e9" stroke="#a9b9ac"/><text x="607.0" y="798" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#5b7065">Lift the ones digit</text><rect x="388.0" y="856" width="199.0" height="72" rx="6" fill="#edf1e9" stroke="#a9b9ac"/><text x="398.0" y="880" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#5b7065">Place the tens digit</text><text x="398.0" y="900" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#5b7065">from this picture</text><rect x="597.0" y="856" width="199.0" height="72" rx="6" fill="#183f39" stroke="#183f39"/><text x="607.0" y="880" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#fffdf5">Lift the tens digit</text><rect x="388" y="952" width="408" height="44" rx="5" fill="#fffdf5" stroke="#7d987d"/><text x="402" y="980" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Hear this step</text><text x="388" y="1023" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">▸ Talk about what changed</text><text x="24" y="1080" font-size="14" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">Static proposal · no learner record created</text></svg>
