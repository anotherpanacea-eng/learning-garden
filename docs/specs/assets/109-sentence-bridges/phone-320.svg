<svg xmlns="http://www.w3.org/2000/svg" width="320" height="2019" viewBox="0 0 320 2019" role="img" aria-labelledby="title desc"><title id="title">Sentence Bridges: reason trial</title><desc id="desc">Original static review art; source and invitation remain visible. No browser or runtime behavior is demonstrated.</desc><rect width="320" height="2019" fill="#f5f4ea"/><text x="16" y="30" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">← Story Loft</text><text x="16" y="78" font-family="Georgia,serif" font-size="29" fill="#183f39">Sentence Bridges</text><text x="16" y="112" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">Two sentences can tell</text><text x="16" y="136" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">different kinds of connections.</text><text x="16" y="160" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">Keep our scene in view. Change</text><text x="16" y="184" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">the joining word and listen to</text><text x="16" y="208" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">what your sentence would say.</text><text x="16" y="244" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" fill="#183f39">Choose a scene</text><rect x="16.0" y="262" width="90.66666666666667" height="48" rx="5" fill="#183f39" stroke="#183f39" stroke-width="4"/><text x="26.0" y="292" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#fffdf5">Supper ✓</text><rect x="114.66666666666667" y="262" width="90.66666666666667" height="48" rx="5" fill="#fffdf5" stroke="#183f39" stroke-width="1"/><text x="124.66666666666667" y="292" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">Lamp</text><rect x="213.33333333333334" y="262" width="90.66666666666667" height="48" rx="5" fill="#fffdf5" stroke="#183f39" stroke-width="1"/><text x="223.33333333333334" y="292" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">Two jobs</text><text x="16" y="338" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">Another scene starts its two</text><text x="16" y="362" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">separate sentences. This visit</text><text x="16" y="386" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">is not saved.</text><rect x="16" y="426" width="288" height="268" rx="5" fill="#e9eedf" stroke="none" stroke-width="1"/><text x="30" y="455" font-family="Georgia,serif" font-size="20" fill="#183f39">Our scene</text><text x="30" y="484" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">Rain was falling. The</text><text x="30" y="508" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">helpers moved supper indoors</text><text x="30" y="532" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">to keep rain off the tables.</text><text x="30" y="556" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">Moving supper did not change</text><text x="30" y="580" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">the weather.</text><text x="30" y="618" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">Purpose: Tell the gathering</text><text x="30" y="642" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">helpers why the supper</text><text x="30" y="666" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">moved.</text><text x="16" y="730" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" fill="#183f39">Choose a joining word</text><rect x="16" y="750" width="79" height="48" rx="5" fill="#fffdf5" stroke="#183f39" stroke-width="1"/><text x="26" y="780" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">and</text><rect x="103" y="750" width="113" height="48" rx="5" fill="#183f39" stroke="#183f39" stroke-width="4"/><text x="113" y="780" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#fffdf5">because ✓</text><rect x="224" y="750" width="80" height="48" rx="5" fill="#fffdf5" stroke="#183f39" stroke-width="1"/><text x="234" y="780" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">but</text><rect x="16" y="826" width="288" height="90" rx="5" fill="#fffdf5" stroke="#758e65" stroke-width="1"/><text x="30" y="854" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">A</text><text x="58" y="854" font-family="Georgia,serif" font-size="19" fill="#183f39">The helpers moved supper</text><text x="58" y="881" font-family="Georgia,serif" font-size="19" fill="#183f39">indoors</text><path d="M150.0 916v14m20 -14v14" stroke="#9a6d18" stroke-width="3"/><rect x="99.0" y="930" width="122" height="48" rx="5" fill="#f0dc9f" stroke="none" stroke-width="1"/><text x="117.0" y="961" font-family="Georgia,serif" font-size="21" fill="#183f39">because</text><path d="M150.0 978v14m20 -14v14" stroke="#9a6d18" stroke-width="3"/><rect x="16" y="992" width="288" height="78" rx="5" fill="#fffdf5" stroke="#758e65" stroke-width="1"/><text x="30" y="1022" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">B</text><text x="58" y="1022" font-family="Georgia,serif" font-size="19" fill="#183f39">rain was falling</text><text x="16" y="1107" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" fill="#183f39">Sentence we are trying</text><text x="16" y="1137" font-family="Georgia,serif" font-size="19" fill="#183f39">The helpers moved supper</text><text x="16" y="1165" font-family="Georgia,serif" font-size="19" fill="#183f39">indoors because rain was</text><text x="16" y="1193" font-family="Georgia,serif" font-size="19" fill="#183f39">falling.</text><text x="16" y="1247" font-family="Georgia,serif" font-size="20" fill="#183f39">Meaning to notice</text><text x="16" y="1277" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">This says rain was the reason</text><text x="16" y="1301" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">the helpers moved supper. That</text><text x="16" y="1325" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">reason is supplied in our</text><text x="16" y="1349" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">scene.</text><rect x="16" y="1393" width="288" height="48" rx="5" fill="#fffdf5" stroke="#183f39" stroke-width="1"/><text x="26" y="1423" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">Swap sentence order</text><rect x="16" y="1453" width="288" height="48" rx="5" fill="#fffdf5" stroke="#183f39" stroke-width="1"/><text x="26" y="1483" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">Separate sentences</text><rect x="16" y="1513" width="288" height="48" rx="5" fill="#fffdf5" stroke="#183f39" stroke-width="1"/><text x="26" y="1543" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">Undo last change</text><rect x="16" y="1573" width="288" height="48" rx="5" fill="#fffdf5" stroke="#183f39" stroke-width="1"/><text x="26" y="1603" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">Hear this trial</text><text x="16" y="1657" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">▼</text><text x="38" y="1657" font-family="Trebuchet MS,Arial,sans-serif" font-size="17" fill="#183f39">What do these joining words</text><text x="38" y="1682" font-family="Trebuchet MS,Arial,sans-serif" font-size="17" fill="#183f39">do?</text><text x="16" y="1717" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">And adds one idea to another.</text><text x="16" y="1741" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">Because gives the second part</text><text x="16" y="1765" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">as a reason for the first. But</text><text x="16" y="1789" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">sets up a contrast: something</text><text x="16" y="1813" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">different or unexpected. A</text><text x="16" y="1837" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">joining word changes what we</text><text x="16" y="1861" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">ask our reader to connect. It</text><text x="16" y="1885" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">does not change what happened</text><text x="16" y="1909" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">in our scene. But does not make</text><text x="16" y="1933" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">either idea untrue.</text><text x="16" y="1989" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">Static original proposal · 320 CSS pixels</text></svg>