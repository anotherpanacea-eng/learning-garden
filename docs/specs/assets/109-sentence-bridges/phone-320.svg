<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1520" viewBox="0 0 320 1520" role="img" aria-labelledby="title desc"><title id="title">Sentence Bridges: phone reason trial</title><desc id="desc">Original static review art. No runtime or browser behavior is demonstrated.</desc><rect width="320" height="1520" fill="#f5f4ea"/><text x="16" y="29" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">← Story Loft</text><text x="16" y="80" font-family="Georgia,serif" font-size="29" fill="#183f39">Sentence Bridges</text><text x="16" y="114" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">Keep our scene. Change how two</text><text x="16" y="138" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">ideas connect.</text><rect x="16" y="167" width="288" height="225" rx="5" fill="#e9eedf" stroke="none"/><text x="30" y="197" font-family="Georgia,serif" font-size="19" fill="#183f39">Our scene · Supper</text><text x="30" y="227" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">Rain was falling. The</text><text x="30" y="251" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">helpers moved supper indoors</text><text x="30" y="275" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">to keep rain off the tables.</text><text x="30" y="299" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">Moving supper did not change</text><text x="30" y="323" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">the weather.</text><text x="30" y="343" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">Purpose: Tell the helpers</text><text x="30" y="367" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">why supper moved.</text><text x="16" y="428" font-family="Trebuchet MS,Arial,sans-serif" font-size="17" fill="#183f39">Choose a joining word</text><rect x="16" y="448" width="79" height="48" rx="5" fill="#fffdf5" stroke="#183f39"/><text x="28" y="478" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">and</text><rect x="103" y="448" width="113" height="48" rx="5" fill="#183f39" stroke="#183f39"/><text x="115" y="478" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#fffdf5">because</text><rect x="224" y="448" width="80" height="48" rx="5" fill="#fffdf5" stroke="#183f39"/><text x="236" y="478" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">but</text><rect x="16" y="520" width="288" height="87" rx="5" fill="#fffdf5" stroke="#758e65"/><text x="30" y="547" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">A</text><text x="58" y="547" font-family="Georgia,serif" font-size="18" fill="#183f39">The helpers moved</text><text x="58" y="573" font-family="Georgia,serif" font-size="18" fill="#183f39">supper indoors</text><path d="M150 607v12m20 -12v12" stroke="#9a6d18" stroke-width="3"/><rect x="99" y="618" width="122" height="44" rx="5" fill="#f0dc9f" stroke="none"/><text x="115" y="646" font-family="Georgia,serif" font-size="19" fill="#183f39">because</text><path d="M150 662v12m20 -12v12" stroke="#9a6d18" stroke-width="3"/><rect x="16" y="675" width="288" height="62" rx="5" fill="#fffdf5" stroke="#758e65"/><text x="30" y="708" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">B</text><text x="58" y="708" font-family="Georgia,serif" font-size="18" fill="#183f39">rain was falling</text><text x="16" y="775" font-family="Trebuchet MS,Arial,sans-serif" font-size="17" fill="#183f39">Sentence we are trying</text><text x="16" y="805" font-family="Georgia,serif" font-size="18" fill="#183f39">The helpers moved supper</text><text x="16" y="832" font-family="Georgia,serif" font-size="18" fill="#183f39">indoors because rain was</text><text x="16" y="859" font-family="Georgia,serif" font-size="18" fill="#183f39">falling.</text><text x="16" y="915" font-family="Georgia,serif" font-size="18" fill="#183f39">Meaning to notice</text><text x="16" y="946" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">This says rain was the reason</text><text x="16" y="970" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">the helpers moved supper. That</text><text x="16" y="994" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">reason is supplied in our scene.</text><rect x="16" y="1044" width="288" height="48" rx="5" fill="#fffdf5" stroke="#183f39"/><text x="28" y="1074" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">Swap sentence order</text><rect x="16" y="1104" width="288" height="48" rx="5" fill="#fffdf5" stroke="#183f39"/><text x="28" y="1134" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">Separate sentences</text><rect x="16" y="1164" width="288" height="48" rx="5" fill="#fffdf5" stroke="#183f39"/><text x="28" y="1194" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">Undo last change</text><rect x="16" y="1224" width="288" height="48" rx="5" fill="#fffdf5" stroke="#183f39"/><text x="28" y="1254" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">Hear this trial</text><text x="16" y="1314" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">Other scenes: Lamp · Two jobs.</text><text x="16" y="1338" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">Each starts with two separate</text><text x="16" y="1362" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">sentences. This visit is not</text><text x="16" y="1386" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">saved.</text><text x="16" y="1432" font-family="Trebuchet MS,Arial,sans-serif" font-size="17" fill="#183f39">What do these words do? ▾</text><text x="16" y="1485" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">Static proposal · 320 CSS pixels</text></svg>