<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1224" viewBox="0 0 820 1224" role="img" aria-labelledby="title desc"><title id="title">Sentence Bridges: contrast trial</title><desc id="desc">Original static review art; source and invitation remain visible. No browser or runtime behavior is demonstrated.</desc><rect width="820" height="1224" fill="#f5f4ea"/><text x="24" y="30" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">← Story Loft</text><text x="24" y="78" font-family="Georgia,serif" font-size="40" fill="#183f39">Sentence Bridges</text><text x="24" y="112" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">Two sentences can tell different kinds of connections. Keep our scene in view.</text><text x="24" y="136" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">Change the joining word and listen to what your sentence would say.</text><text x="24" y="172" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" fill="#183f39">Choose a scene</text><rect x="24.0" y="190" width="252.0" height="48" rx="5" fill="#fffdf5" stroke="#183f39" stroke-width="1"/><text x="34.0" y="220" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">Supper</text><rect x="284.0" y="190" width="252.0" height="48" rx="5" fill="#183f39" stroke="#183f39" stroke-width="4"/><text x="294.0" y="220" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#fffdf5">Lamp ✓</text><rect x="544.0" y="190" width="252.0" height="48" rx="5" fill="#fffdf5" stroke="#183f39" stroke-width="1"/><text x="554.0" y="220" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">Two jobs</text><text x="24" y="266" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">Another scene starts its two separate sentences. This visit is not saved.</text><rect x="24" y="306" width="300" height="319" rx="5" fill="#e9eedf" stroke="none" stroke-width="1"/><text x="40" y="336" font-family="Georgia,serif" font-size="23" fill="#183f39">Our scene</text><text x="40" y="364" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">The lamp was lit. A thick</text><text x="40" y="388" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">screen blocked its light, so</text><text x="40" y="412" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">the room was dark. The</text><text x="40" y="436" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">helpers had expected the</text><text x="40" y="460" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">lamp to brighten the room.</text><text x="40" y="484" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">This note does not say why</text><text x="40" y="508" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">anyone lit it.</text><text x="40" y="548" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">Purpose: Tell the stage</text><text x="40" y="572" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">helpers what was unexpected</text><text x="40" y="596" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">about the room.</text><text x="24" y="663" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" fill="#183f39">Choose a joining word</text><rect x="24" y="683" width="82" height="48" rx="5" fill="#fffdf5" stroke="#183f39" stroke-width="1"/><text x="34" y="713" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">and</text><rect x="115" y="683" width="115" height="48" rx="5" fill="#fffdf5" stroke="#183f39" stroke-width="1"/><text x="125" y="713" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">because</text><rect x="239" y="683" width="85" height="48" rx="5" fill="#183f39" stroke="#183f39" stroke-width="4"/><text x="249" y="713" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#fffdf5">but ✓</text><rect x="24" y="761" width="300" height="48" rx="5" fill="#fffdf5" stroke="#183f39" stroke-width="1"/><text x="34" y="791" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">Swap sentence order</text><rect x="24" y="821" width="300" height="48" rx="5" fill="#fffdf5" stroke="#183f39" stroke-width="1"/><text x="34" y="851" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">Separate sentences</text><rect x="24" y="881" width="300" height="48" rx="5" fill="#fffdf5" stroke="#183f39" stroke-width="1"/><text x="34" y="911" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">Undo last change</text><rect x="24" y="941" width="300" height="48" rx="5" fill="#fffdf5" stroke="#183f39" stroke-width="1"/><text x="34" y="971" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">Hear this trial</text><rect x="352" y="306" width="444" height="90" rx="5" fill="#fffdf5" stroke="#758e65" stroke-width="1"/><text x="366" y="334" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">A</text><text x="394" y="334" font-family="Georgia,serif" font-size="19" fill="#183f39">The room was dark</text><path d="M564.0 396v14m20 -14v14" stroke="#9a6d18" stroke-width="3"/><rect x="513.0" y="410" width="122" height="48" rx="5" fill="#f0dc9f" stroke="none" stroke-width="1"/><text x="531.0" y="441" font-family="Georgia,serif" font-size="21" fill="#183f39">but</text><path d="M564.0 458v14m20 -14v14" stroke="#9a6d18" stroke-width="3"/><rect x="352" y="472" width="444" height="78" rx="5" fill="#fffdf5" stroke="#758e65" stroke-width="1"/><text x="366" y="502" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">B</text><text x="394" y="502" font-family="Georgia,serif" font-size="19" fill="#183f39">the lamp was lit</text><text x="352" y="590" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" fill="#183f39">Sentence we are trying</text><text x="352" y="624" font-family="Georgia,serif" font-size="23" fill="#183f39">The room was dark, but the lamp</text><text x="352" y="657" font-family="Georgia,serif" font-size="23" fill="#183f39">was lit.</text><text x="352" y="722" font-family="Georgia,serif" font-size="23" fill="#183f39">Meaning to notice</text><text x="352" y="757" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" fill="#183f39">This highlights a contrast: the room was</text><text x="352" y="785" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" fill="#183f39">dark even with the lamp lit. Our scene</text><text x="352" y="813" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" fill="#183f39">supplies the expectation that the lamp</text><text x="352" y="841" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" fill="#183f39">would brighten it.</text><text x="24" y="1031" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">▼</text><text x="46" y="1031" font-family="Trebuchet MS,Arial,sans-serif" font-size="17" fill="#183f39">What do these joining words do?</text><text x="24" y="1066" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">And adds one idea to another. Because gives the second part as a reason for</text><text x="24" y="1090" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">the first. But sets up a contrast: something different or unexpected. A</text><text x="24" y="1114" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">joining word changes what we ask our reader to connect. It does not change</text><text x="24" y="1138" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">what happened in our scene. But does not make either idea untrue.</text><text x="24" y="1194" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">Static original proposal · 820 CSS pixels</text></svg>