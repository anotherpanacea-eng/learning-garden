<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1040" viewBox="0 0 820 1040" role="img" aria-labelledby="title desc"><title id="title">Sentence Bridges: tablet contrast trial</title><desc id="desc">Original static review art. No runtime or browser behavior is demonstrated.</desc><rect width="820" height="1040" fill="#f5f4ea"/><text x="24" y="35" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" fill="#183f39">After the Storm · Story Loft</text><text x="24" y="99" font-family="Georgia,serif" font-size="40" fill="#183f39">Sentence Bridges</text><text x="24" y="137" font-family="Trebuchet MS,Arial,sans-serif" font-size="19" fill="#183f39">Keep our scene. Change how two ideas connect.</text><rect x="24" y="178" width="300" height="315" rx="5" fill="#e9eedf" stroke="none"/><text x="42" y="211" font-family="Georgia,serif" font-size="23" fill="#183f39">Our scene · The lamp</text><text x="42" y="244" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">The lamp was lit. A thick</text><text x="42" y="268" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">screen blocked its light, so</text><text x="42" y="292" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">the room stayed dark. The</text><text x="42" y="316" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">helpers had expected the</text><text x="42" y="340" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">lamp to brighten the room.</text><text x="42" y="364" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">This note does not say why</text><text x="42" y="388" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">anyone lit it.</text><text x="42" y="445" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">Purpose: Tell the helpers</text><text x="42" y="469" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">what was unexpected.</text><text x="24" y="535" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" fill="#183f39">Choose a joining word</text><rect x="24" y="555" width="82" height="48" rx="5" fill="#fffdf5" stroke="#183f39"/><text x="36" y="585" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">and</text><rect x="115" y="555" width="115" height="48" rx="5" fill="#fffdf5" stroke="#183f39"/><text x="127" y="585" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">because</text><rect x="239" y="555" width="85" height="48" rx="5" fill="#183f39" stroke="#183f39"/><text x="251" y="585" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#fffdf5">but</text><rect x="24" y="630" width="300" height="48" rx="5" fill="#fffdf5" stroke="#183f39"/><text x="36" y="660" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">Swap sentence order</text><rect x="24" y="691" width="300" height="48" rx="5" fill="#fffdf5" stroke="#183f39"/><text x="36" y="721" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">Separate sentences</text><rect x="24" y="752" width="300" height="48" rx="5" fill="#fffdf5" stroke="#183f39"/><text x="36" y="782" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">Undo last change</text><rect x="24" y="813" width="300" height="48" rx="5" fill="#fffdf5" stroke="#183f39"/><text x="36" y="843" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">Hear this trial</text><text x="24" y="906" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">Another scene starts its two</text><text x="24" y="930" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">separate sentences. This visit</text><text x="24" y="954" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">is not saved.</text><rect x="358" y="178" width="438" height="106" rx="5" fill="#fffdf5" stroke="#758e65"/><text x="377" y="210" font-family="Trebuchet MS,Arial,sans-serif" font-size="17" fill="#183f39">A</text><text x="411" y="235" font-family="Georgia,serif" font-size="25" fill="#183f39">The room stayed dark</text><path d="M566 284v16m20 -16v16" stroke="#9a6d18" stroke-width="3"/><rect x="525" y="300" width="104" height="50" rx="5" fill="#f0dc9f" stroke="none"/><text x="558" y="333" font-family="Georgia,serif" font-size="24" fill="#183f39">but</text><path d="M566 350v16m20 -16v16" stroke="#9a6d18" stroke-width="3"/><rect x="358" y="367" width="438" height="106" rx="5" fill="#fffdf5" stroke="#758e65"/><text x="377" y="400" font-family="Trebuchet MS,Arial,sans-serif" font-size="17" fill="#183f39">B</text><text x="411" y="425" font-family="Georgia,serif" font-size="25" fill="#183f39">the lamp was lit</text><text x="358" y="520" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" fill="#183f39">Sentence we are trying</text><text x="358" y="555" font-family="Georgia,serif" font-size="25" fill="#183f39">The room stayed dark, but the</text><text x="358" y="589" font-family="Georgia,serif" font-size="25" fill="#183f39">lamp was lit.</text><text x="358" y="665" font-family="Georgia,serif" font-size="23" fill="#183f39">Meaning to notice</text><text x="358" y="704" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" fill="#183f39">This highlights a contrast: the room stayed</text><text x="358" y="732" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" fill="#183f39">dark even with the lamp lit. Our scene</text><text x="358" y="760" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" fill="#183f39">supplies the expectation that the lamp</text><text x="358" y="788" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" fill="#183f39">would brighten it.</text><text x="358" y="858" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" fill="#183f39">What do these joining words do? ▾</text><text x="358" y="904" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">A different joining word changes the</text><text x="358" y="928" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">relation we offer our reader. Our scene</text><text x="358" y="952" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">stays the same.</text><text x="24" y="1010" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#183f39">Static original proposal · 820 CSS pixels · selected contrast; no runtime behavior demonstrated.</text></svg>