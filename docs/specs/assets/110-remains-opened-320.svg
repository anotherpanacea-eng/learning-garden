<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1648" viewBox="0 0 320 1648" role="img" aria-labelledby="title desc"><title id="title">Write what remains — opened at 320</title><desc id="desc">Original static design: 42 counters across the table and store tray; group counts before returning are separate from result digits. After opening one ten, twelve loose ones are on the table. Result digits remain blank.</desc><rect width="100%" height="100%" fill="#f7faf5"/><text x="16" y="26" font-size="14" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">Learning Garden · original design sample</text><text x="16" y="57" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">‹ Return to the returning table</text><text x="16" y="99" font-size="26" font-family="Georgia,serif" font-weight="normal" fill="#183f39">Write what remains</text><text x="16" y="127" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">One supplied ones-first strategy</text><rect x="16" y="145" width="288" height="58" rx="5" fill="#eef5e9" stroke="#7d987d"/><text x="28" y="169" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Start: 42 counters.</text><text x="28" y="191" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Return: 17.</text><text x="16" y="231" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">▸ Read the original return request</text><rect x="16" y="252" width="139.0" height="44" rx="8" fill="#fffdf5" stroke="#b5c8b4"/><text x="34" y="280" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Picture</text><rect x="165.0" y="252" width="139.0" height="44" rx="8" fill="#183f39" stroke="#183f39"/><text x="183.0" y="280" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#fffdf5">Write</text><text x="16" y="327" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">This fresh writing picture</text><text x="16" y="349" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">starts again when you leave.</text><text x="16" y="371" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">Your returning table stays as</text><text x="16" y="393" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">you left it.</text><text x="16" y="427" font-size="22" font-family="Georgia,serif" font-weight="normal" fill="#183f39">The same 42 counters</text><rect x="16" y="445" width="288" height="146" rx="8" fill="#eef5e9" stroke="#7d987d"/><text x="26" y="469" font-size="17" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Pip&#x27;s table</text><text x="26" y="492" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">3 tens · 12 ones</text><rect x="26" y="504" width="58" height="33" rx="5" fill="#f8f7e9" stroke="#7d987d"/><rect x="32" y="510" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="41" y="510" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="50" y="510" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="59" y="510" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="68" y="510" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="32" y="521" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="41" y="521" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="50" y="521" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="59" y="521" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="68" y="521" width="7" height="9" rx="1.5" fill="#ddc28e" str