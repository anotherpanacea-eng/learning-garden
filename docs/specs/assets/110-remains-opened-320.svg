ght="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="58" y="547" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="73" y="547" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="88" y="547" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="103" y="547" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="118" y="547" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="133" y="547" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="148" y="547" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="163" y="547" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="178" y="547" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="193" y="547" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="16" y="603" width="288" height="76" rx="8" fill="#eef4f8" stroke="#4f748f"/><text x="26" y="627" font-size="17" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Store tray</text><text x="26" y="650" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">0 tens · 0 ones</text><text x="26" y="671" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">Empty</text><text x="16" y="703" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Together: 42 counters.</text><text x="16" y="732" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">Three tens and twelve ones are</text><text x="16" y="754" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">still 42 on the table. Opening</text><text x="16" y="776" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">changed the grouping. Nothing</text><text x="16" y="798" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">went to the store tray.</text><text x="16" y="835" font-size="22" font-family="Georgia,serif" font-weight="normal" fill="#183f39">Working groups</text><text x="16" y="859" font-size="18" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">before returning</text><rect x="16" y="874" width="288" height="108" rx="5" fill="#fff0c8" stroke="#c6a46c"/><text x="26" y="898" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">The same 42 can be 3 tens and</text><text x="26" y="920" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">12 ones. These are group</text><text x="26" y="942" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">counts; 12 means twelve loose</text><text x="26" y="964" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">ones.</text><rect x="16" y="999" width="288" height="114" rx="0" fill="#fffdf5" stroke="#9bb8a8"/><path d="M16 1029h288" stroke="#9bb8a8"/><path d="M16 1071h288" stroke="#9bb8a8"/><path d="M102 999v114" stroke="#9bb8a8"/><path d="M203.0 999v114" stroke="#9bb8a8"/><text x="110" y="1020" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Tens</text><text x="211.0" y="1020" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Ones</text><text x="25" y="1056" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Use</text><text x="25" y="1099" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">− Return</text><text x="144.5" y="1060" font-size="28" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">3</text><text x="239.5" y="1060" font-size="28" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">12</text><text x="144.5" y="1103" font-size="28" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">1</text><text x="245.5" y="1103" font-size="28" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">7</text><text x="16" y="1144" font-size="20" font-family="Georgia,serif" font-weight="normal" fill="#183f39">Digits left on the table</text><rect x="16" y="1162" width="288" height="48" rx="0" fill="#eef5e9" stroke="#7d987d"/><path d="M102 1162v48" stroke="#9bb8a8"/><path d="M203.0 1162v48" stroke="#9bb8a8"/><text x="25" y="1193" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Left</text><text x="144.5" y="1196" font-size="28" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">□</text><text x="245.5" y="1196" font-size="28" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">□</text><text x="16" y="1240" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Return the seven loose ones in</text><text x="16" y="1262" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Picture before placing a result</text><text x="16" y="1284" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">digit.</text><rect x="16.0" y="1314" width="139.0" height="72" rx="6" fill="#edf1e9" stroke="#a9b9ac"/><text x="26.0" y="1338" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#5b7065">Place the ones</text><text x="26.0" y="1358" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#5b7065">digit from this</text><text x="26.0" y="1378" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#5b7065">picture</text><rect x="165.0" y="1314" width="139.0" height="72" rx="6" fill="#edf1e9" stroke="#a9b9ac"/><text x="175.0" y="1338" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#5b7065">Lift the ones</text><text x="175.0" y="1358" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#5b7065">digit</text><rect x="16.0" y="1396" width="139.0" height="72" rx="6" fill="#edf1e9" stroke="#a9b9ac"/><text x="26.0" y="1420" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#5b7065">Place the tens</text><text x="26.0" y="1440" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#5b7065">digit from this</text><text x="26.0" y="1460" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#5b7065">picture</text><rect x="165.0" y="1396" width="139.0" height="72" rx="6" fill="#edf1e9" stroke="#a9b9ac"/><text x="175.0" y="1420" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#5b7065">Lift the tens</text><text x="175.0" y="1440" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#5b7065">digit</text><rect x="16" y="1492" width="288" height="44" rx="5" fill="#fffdf5" stroke="#7d987d"/><text x="30" y="1520" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Hear this step</text><text x="16" y="1563" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">▸ Talk about what changed</text><text x="16" y="1620" font-size="14" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">Static proposal · no learner record created</text></svg>
