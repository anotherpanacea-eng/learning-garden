<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1152" viewBox="0 0 820 1152" role="img" aria-labelledby="title desc"><title id="title">Write what remains — opened at 820</title><desc id="desc">Original static design: 42 counters across the table and store tray; group counts before returning are separate from result digits. After opening one ten, twelve loose ones are on the table. Result digits remain blank.</desc><rect width="100%" height="100%" fill="#f7faf5"/><text x="24" y="26" font-size="14" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">Learning Garden · original design sample</text><text x="24" y="57" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">‹ Return to the returning table</text><text x="24" y="99" font-size="34" font-family="Georgia,serif" font-weight="normal" fill="#183f39">Write what remains</text><text x="24" y="127" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">One supplied ones-first strategy</text><rect x="24" y="145" width="772" height="58" rx="5" fill="#eef5e9" stroke="#7d987d"/><text x="36" y="169" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Start: 42 counters.</text><text x="36" y="191" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Return 17: one ten and seven ones.</text><text x="24" y="231" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">▸ Read the original return request</text><rect x="24" y="252" width="381.0" height="44" rx="8" fill="#fffdf5" stroke="#b5c8b4"/><text x="42" y="280" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Picture</text><rect x="415.0" y="252" width="381.0" height="44" rx="8" fill="#183f39" stroke="#183f39"/><text x="433.0" y="280" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#fffdf5">Write</text><text x="24" y="327" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">This fresh writing picture starts again when you leave. Earlier returning work is</text><text x="24" y="349" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">kept.</text><text x="24" y="383" font-size="22" font-family="Georgia,serif" font-weight="normal" fill="#183f39">The same 42 counters</text><rect x="24" y="401" width="340" height="146" rx="8" fill="#eef5e9" stroke="#7d987d"/><text x="34" y="425" font-size="17" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Pip&#x27;s table</text><text x="34" y="448" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">3 tens · 12 ones</text><rect x="34" y="460" width="58" height="33" rx="5" fill="#f8f7e9" stroke="#7d987d"/><rect x="40" y="466" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="49" y="466" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="58" y="466" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="67" y="466" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="76" y="466" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="40" y="477" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="49" y="477" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="58" y="477" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="67" y="477" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="76" y="477" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="99" y="460" width="58" height="33" rx="5" fill="#f8f7e9" stroke="#7d987d"/><rect x="105" y="466" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="114" y="466" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="123" y="466" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="132" y="466" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="141" y="466" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="105" y="477" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="114" y="477" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="123" y="477" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="132" y="477" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="141" y="477" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="164" y="460" width="58" height="33" rx="5" fill="#f8f7e9" stroke="#7d987d"/><rect x="170" y="466" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="179" y="466" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="188" y="466" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="197" y="466" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="206" y="466" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="170" y="477" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="179" y="477" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="188" y="477" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="197" y="477" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="206" y="477" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="36" y="503" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="51" y="503" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="66" y="503" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="81" y="503" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="96" y="503" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="111" y="503" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="126" y="503" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="141" y="503" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="156" y="503" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="171" y="503" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="186" y="503" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="201" y="503" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="24" y="559" width="340" height="76" rx="8" fill="#eef4f8" stroke="#4f748f"/><text x="34" y="583" font-size="17" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Store tray</text><text x="34" y="606" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">0 tens · 0 ones</text><text x="34" y="627" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">Empty</text><text x="24" y="659" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Together: 42 counters.</text><text x="24" y="688" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">Three tens and twelve ones are still</text><text x="24" y="710" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">42 on the table. Opening changed the</text><text x="24" y="732" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">grouping. Nothing went to the store</text><text x="24" y="754" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">tray.</text><text x="388" y="383" font-size="22" font-family="Georgia,serif" font-weight="normal" fill="#183f39">Working groups</text><text x="388" y="407" font-size="18" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">before returning</text><rect x="388" y="422" width="408" height="86" rx="5" fill="#fff0c8" stroke="#c6a46c"/><text x="398" y="446" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">The same 42 can be 3 tens and 12</text><text x="398" y="468" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">ones. Group counts; 12 here means</text><text x="398" y="490" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">twelve loose ones.</text><rect x="388" y="525" width="408" height="114" rx="0" fill="#fffdf5" stroke="#9bb8a8"/><path d="M388 555h408" stroke="#9bb8a8"/><path d="M388 597h408" stroke="#9bb8a8"/><path d="M474 525v114" stroke="#9bb8a8"/><path d="M635.0 525v114" stroke="#9bb8a8"/><text x="482" y="546" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Tens</text><text x="643.0" y="546" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Ones</text><text x="397" y="582" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Use</text><text x="397" y="625" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">− Return</text><text x="546.5" y="586" font-size="28" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">3</text><text x="701.5" y="586" font-size="28" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">12</text><text x="546.5" y="629" font-size="28" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">1</text><text x="707.5" y="629" font-size="28" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">7</text><text x="388" y="670" font-size="20" font-family="Georgia,serif" font-weight="normal" fill="#183f39">Digits left on the table</text><rect x="388" y="688" width="408" height="48" rx="0" fill="#eef5e9" stroke="#7d987d"/><path d="M474 688v48" stroke="#9bb8a8"/><path d="M635.0 688v48" stroke="#9bb8a8"/><text x="397" y="719" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Left</text><text x="546.5" y="722" font-size="28" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">□</text><text x="707.5" y="722" font-size="28" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">□</text><text x="388" y="766" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Return the seven loose ones in Picture</text><text x="388" y="788" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">before placing a result digit.</text><rect x="388.0" y="818" width="199.0" height="72" rx="6" fill="#edf1e9" stroke="#a9b9ac"/><text x="398.0" y="842" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#5b7065">Place the ones digit</text><text x="398.0" y="862" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#5b7065">from this picture</text><rect x="597.0" y="818" width="199.0" height="72" rx="6" fill="#edf1e9" stroke="#a9b9ac"/><text x="607.0" y="842" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#5b7065">Lift the ones digit</text><rect x="388.0" y="900" width="199.0" height="72" rx="6" fill="#edf1e9" stroke="#a9b9ac"/><text x="398.0" y="924" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#5b7065">Place the tens digit</text><text x="398.0" y="944" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#5b7065">from this picture</text><rect x="597.0" y="900" width="199.0" height="72" rx="6" fill="#edf1e9" stroke="#a9b9ac"/><text x="607.0" y="924" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#5b7065">Lift the tens digit</text><rect x="388" y="996" width="408" height="44" rx="5" fill="#fffdf5" stroke="#7d987d"/><text x="402" y="1024" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Hear this step</text><text x="388" y="1067" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">▸ Talk about what changed</text><text x="24" y="1124" font-size="14" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">Static proposal · no learner record created</text></svg>
