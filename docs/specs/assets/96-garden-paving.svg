<svg xmlns="http://www.w3.org/2000/svg" width="920" height="640" viewBox="0 0 920 640" role="img" aria-labelledby="title desc">
<title id="title">Garden Paving: the missing corner and the completed square</title>
<desc id="desc">Two original three-to-four planning diagrams retain the same nine old tiles. The first has a new bottom patch of three and a new right patch of three, but an empty bottom-right corner: six added, fifteen total. The second also has the one corner: seven added, sixteen total. This is an L-shaped addition along two sides, not a border around all four sides.</desc>
<defs>
<pattern id="old" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#dce8d4"/><circle cx="5" cy="5" r="1.6" fill="#658467"/></pattern>
<pattern id="bottom" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f5dfae"/><path d="M0 4H8" stroke="#9d752f" stroke-width="1.5"/></pattern>
<pattern id="right" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#d6e9e7"/><path d="M-2 2L2-2M0 9L9 0M7 11L11 7" stroke="#4a7e83" stroke-width="1.4"/></pattern>
<pattern id="corner" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f0d8d8"/><path d="M5 2V8M2 5H8" stroke="#a65a68" stroke-width="1.3"/></pattern>
</defs>
