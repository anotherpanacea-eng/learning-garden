<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1290" viewBox="0 0 390 1290" role="img" aria-labelledby="title desc">
<title id="title">Review contact sheet: land snail and earthworm movement models</title>
<desc id="desc">Six original simplified teaching frames at phone width. Three snail pictures show a broad muscular foot, a highlighted foot muscle wave, and a slight illustrative move. Three earthworm pictures show ringed-body shape changes with a separate enlarged callout of tiny bristles. Distances, timing and bristle size are not to scale.</desc>
