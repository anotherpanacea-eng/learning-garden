<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1360" viewBox="0 0 360 1360" role="img" aria-labelledby="title desc">
<title id="title">Ribbon Recut Table, original four-frame half-ribbon mock</title>
<desc id="desc">Four panels show one same-size whole. The upper uncut reference always colors its first half. The lower working ribbon changes from one of two colored parts to two of four, then four of eight, then joins back to two of four. A brass flag stays at the same endpoint. Solid marks are older boundaries; dashed marks are newly inserted cuts.</desc>
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#e9b898"/><path d="M-2 8L8-2M2 10L10 2" stroke="#9a5a38" stroke-width="1.3"/></pattern></defs>
<style>text{font-family:Arial,sans-serif;fill:#193e38}.head{font-size:20px;font-weight:700}.case{font-size:17px;font-weight:700}.label{font-size:14px}.small{font-size:13px}.strong{font-weight:700}.older{stroke:#193e38;stroke-width:2.2}.new{stroke:#174d78;stroke-width:3;stroke-dasharray:5 3}</style>
<rect width="360" height="1360" rx="16" fill="#f3f0e5"/>
<text x="16" y="29" class="head">Ribbon Recut Table</text>
<text x="16" y="52" class="label">One whole and one colored endpoint stay fixed.</text>
<g transform="translate(0 66)">
<rect x="15" y="0" width="330" height="312" rx="14" fill="#fffdf7" stroke="#a3b8a9"/>
<text x="28" y="29" class="case">Start · one half</text>
<text x="28" y="58" class="label">Half for the lantern window · whole 0–1</text>
<text x="28" y="82" class="label">Uncut reference: same colored length</text>
<text x="28" y="151" class="label">Our recut ribbon</text>
<rect x="36" y="94" width="288" height="31" fill="#fff9ef" stroke="#2e5850" stroke-width="2"/>
<rect x="36" y="94" width="144" height="31" fill="url(#hatch)"/>
<rect x="36" y="165" width="288" height="31" fill="#fff9ef" stroke="#2e5850" stroke-width="2"/>
<rect x="36" y="165" width="144" height="31" fill="url(#hatch)"/>
<path d="M180 126V165" stroke="#7a5b18" stroke-width="2.5"/>
<path d="M180 135l-7 8h14z" fill="#d6a935" stroke="#6c5319"/>
<text x="36" y="215" class="small">0</text><text x="318" y="215" class="small">1</text>
<text x="28" y="240" class="label strong">1 of 2 equal parts colored · same colored end</text>
<text x="28" y="265" class="label">One older cut splits this whole into halves.</text>
<text x="28" y="287" class="label">Try splitting every equal part in two.</text>
<path d="M180 166V195" class="older"/>
</g>
<g transform="translate(0 386)">
<rect x="15" y="0" width="330" height="312" rx="14" fill="#fffdf7" stroke="#a3b8a9"/>
<text x="28" y="29" class="case">Split once · two fourths</text>
<text x="28" y="58" class="label">Half for the lantern window · whole 0–1</text>
<text x="28" y="82" class="label">Uncut reference: same colored length</text>
<text x="28" y="151" class="label">Our recut ribbon</text>
<rect x="36" y="94" width="288" height="31" fill="#fff9ef" stroke="#2e5850" stroke-width="2"/>
<rect x="36" y="94" width="144" height="31" fill="url(#hatch)"/>
<rect x="36" y="165" width="288" height="31" fill="#fff9ef" stroke="#2e5850" stroke-width="2"/>
<rect x="36" y="165" width="144" height="31" fill="url(#hatch)"/>
<path d="M180 126V165" stroke="#7a5b18" stroke-width="2.5"/>
<path d="M180 135l-7 8h14z" fill="#d6a935" stroke="#6c5319"/>
<text x="36" y="215" class="small">0</text><text x="318" y="215" class="small">1</text>
<text x="28" y="240" class="label strong">2 of 4 equal parts colored · same colored end</text>
<text x="28" y="265" class="label">Solid = older cut. Dashed = new cuts.</text>
<text x="28" y="287" class="label">Two smaller parts cover the same length.</text>
<path d="M108 166V195" class="new"/>
<path d="M180 166V195" class="older"/>
<path d="M252 166V195" class="new"/>
</g>
<g transform="translate(0 706)">
<rect x="15" y="0" width="330" height="312" rx="14" fill="#fffdf7" stroke="#a3b8a9"/>
<text x="28" y="29" class="case">Split again · four eighths</text>
<text x="28" y="58" class="label">Half for the lantern window · whole 0–1</text>
<text x="28" y="82" class="label">Uncut reference: same colored length</text>
<text x="28" y="151" class="label">Our recut ribbon</text>
<rect x="36" y="94" width="288" height="31" fill="#fff9ef" stroke="#2e5850" stroke-width="2"/>
<rect x="36" y="94" width="144" height="31" fill="url(#hatch)"/>
<rect x="36" y="165" width="288" height="31" fill="#fff9ef" stroke="#2e5850" stroke-width="2"/>
<rect x="36" y="165" width="144" height="31" fill="url(#hatch)"/>
<path d="M180 126V165" stroke="#7a5b18" stroke-width="2.5"/>
<path d="M180 135l-7 8h14z" fill="#d6a935" stroke="#6c5319"/>
<text x="36" y="215" class="small">0</text><text x="318" y="215" class="small">1</text>
<text x="28" y="240" class="label strong">4 of 8 equal parts colored · same colored end</text>
<text x="28" y="265" class="label">Solid = older cuts. Dashed = new cuts.</text>
<text x="28" y="287" class="label">Four smaller parts cover the same length.</text>
<path d="M72 166V195" class="new"/>
<path d="M108 166V195" class="older"/>
<path d="M144 166V195" class="new"/>
<path d="M180 166V195" class="older"/>
<path d="M216 166V195" class="new"/>
<path d="M252 166V195" class="older"/>
<path d="M288 166V195" class="new"/>
</g>
<g transform="translate(0 1026)">
<rect x="15" y="0" width="330" height="312" rx="14" fill="#fffdf7" stroke="#a3b8a9"/>
<text x="28" y="29" class="case">Join pairs · two fourths</text>
<text x="28" y="58" class="label">Half for the lantern window · whole 0–1</text>
<text x="28" y="82" class="label">Uncut reference: same colored length</text>
<text x="28" y="151" class="label">Our recut ribbon</text>
<rect x="36" y="94" width="288" height="31" fill="#fff9ef" stroke="#2e5850" stroke-width="2"/>
<rect x="36" y="94" width="144" height="31" fill="url(#hatch)"/>
<rect x="36" y="165" width="288" height="31" fill="#fff9ef" stroke="#2e5850" stroke-width="2"/>
<rect x="36" y="165" width="144" height="31" fill="url(#hatch)"/>
<path d="M180 126V165" stroke="#7a5b18" stroke-width="2.5"/>
<path d="M180 135l-7 8h14z" fill="#d6a935" stroke="#6c5319"/>
<text x="36" y="215" class="small">0</text><text x="318" y="215" class="small">1</text>
<text x="28" y="240" class="label strong">2 of 4 equal parts colored · same colored end</text>
<text x="28" y="265" class="label">The extra eighth cuts are gone.</text>
<text x="28" y="287" class="label">The flag and colored length did not move.</text>
<path d="M108 166V195" class="older"/>
<path d="M180 166V195" class="older"/>
<path d="M252 166V195" class="older"/>
</g>
</svg>
