nt-weight="bold" fill="#183f39">Store tray</text><text x="26" y="609" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">1 ten · 2 ones</text><rect x="26" y="621" width="58" height="33" rx="5" fill="#eef4f8" stroke="#4f748f"/><rect x="32" y="627" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="41" y="627" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="50" y="627" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="59" y="627" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="68" y="627" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="32" y="638" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="41" y="638" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="50" y="638" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="59" y="638" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="68" y="638" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="28" y="664" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="43" y="664" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><text x="16" y="712" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Together: 42 counters.</text><text x="16" y="741" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">Four tens minus the returned</text><text x="16" y="763" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">ten leaves three tens. The</text><text x="16" y="785" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">table&#x27;s three tens and zero</text><text x="16" y="807" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">ones read 30. Together with the</text><text x="16" y="829" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">store tray, all 42 counters are</text><text x="16" y="851" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">still here.</text><text x="16" y="888" font-size="22" font-family="Georgia,serif" font-weight="normal" fill="#183f39">Working groups</text><text x="16" y="912" font-size="18" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">before returning</text><rect x="16" y="927" width="288" height="64" rx="5" fill="#fff0c8" stroke="#c6a46c"/><text x="26" y="951" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">Use the original 4 tens and 2</text><text x="26" y="973" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">ones. No ten needs opening.</text><rect x="16" y="1008" width="288" height="114" rx="0" fill="#fffdf5" stroke="#9bb8a8"/><path d="M16 1038h288" stroke="#9bb8a8"/><path d="M16 1080h288" stroke="#9bb8a8"/><path d="M102 1008v114" stroke="#9bb8a8"/><path d="M203.0 1008v114" stroke="#9bb8a8"/><text x="110" y="1029" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Tens</text><text x="211.0" y="1029" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Ones</text><text x="25" y="1065" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Use</text><text x="25" y="1108" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">− Return</text><text x="144.5" y="1069" font-size="28" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">4</text><text x="245.5" y="1069" font-size="28" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">2</text><text x="144.5" y="1112" font-size="28" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">1</text><text x="245.5" y="1112" font-size="28" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">2</text><text x="16" y="1153" font-size="20" font-family="Georgia,serif" font-weight="normal" fill="#183f39">Digits left on the table</text><rect x="16" y="1171" width="288" height="48" rx="0" fill="#eef5e9" stroke="#7d987d"/><path d="M102 1171v48" stroke="#9bb8a8"/><path d="M203.0 1171v48" stroke="#9bb8a8"/><text x="25" y="1202" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Left</text><text x="144.5" y="1205" font-size="28" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">3</text><text x="245.5" y="1205" font-size="28" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">0</text><text x="16" y="1249" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Supplied writing: 42 − 12 = 30.</text><rect x="16.0" y="1279" width="139.0" height="72" rx="6" fill="#edf1e9" stroke="#a9b9ac"/><text x="26.0" y="1303" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#5b7065">Place the ones</text><text x="26.0" y="1323" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#5b7065">digit from this</text><text x="26.0" y="1343" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#5b7065">picture</text><rect x="165.0" y="1279" width="139.0" height="72" rx="6" fill="#edf1e9" stroke="#a9b9ac"/><text x="175.0" y="1303" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#5b7065">Lift the ones</text><text x="175.0" y="1323" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#5b7065">digit</text><rect x="16.0" y="1361" width="139.0" height="72" rx="6" fill="#edf1e9" stroke="#a9b9ac"/><text x="26.0" y="1385" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#5b7065">Place the tens</text><text x="26.0" y="1405" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#5b7065">digit from this</text><text x="26.0" y="1425" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#5b7065">picture</text><rect x="165.0" y="1361" width="139.0" height="72" rx="6" fill="#183f39" stroke="#183f39"/><text x="175.0" y="1385" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#fffdf5">Lift the tens</text><text x="175.0" y="1405" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#fffdf5">digit</text><rect x="16" y="1457" width="288" height="44" rx="5" fill="#fffdf5" stroke="#7d987d"/><text x="30" y="1485" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Hear this step</text><text x="16" y="1528" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">▸ Talk about what changed</text><text x="16" y="1585" font-size="14" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">Static proposal · no learner record created</text></svg>
