<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1654" viewBox="0 0 320 1654" role="img" aria-labelledby="title desc"><title id="title">Write what remains — finished at 320</title><desc id="desc">Original static design: 42 counters across the table and store tray; group counts before returning are separate from result digits. The supplied written remainder is 25.</desc><rect width="100%" height="100%" fill="#f7faf5"/><text x="16" y="26" font-size="14" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">Learning Garden · original design sample</text><text x="16" y="57" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">‹ Return to the returning table</text><text x="16" y="99" font-size="26" font-family="Georgia,serif" font-weight="normal" fill="#183f39">Write what remains</text><text x="16" y="127" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">One supplied ones-first strategy</text><rect x="16" y="145" width="288" height="80" rx="5" fill="#eef5e9" stroke="#7d987d"/><text x="28" y="169" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Start: 42 counters.</text><text x="28" y="191" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Return 17: one ten and seven</text><text x="28" y="213" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">ones.</text><text x="16" y="253" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">▸ Read the original return request</text><rect x="16" y="274" width="139.0" height="44" rx="8" fill="#fffdf5" stroke="#b5c8b4"/><text x="34" y="302" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Picture</text><rect x="165.0" y="274" width="139.0" height="44" rx="8" fill="#183f39" stroke="#183f39"/><text x="183.0" y="302" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#fffdf5">Write</text><text x="16" y="349" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">This fresh writing picture</text><text x="16" y="371" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">starts again when you leave.</text><text x="16" y="393" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">Earlier returning work is kept.</text><text x="16" y="427" font-size="22" font-family="Georgia,serif" font-weight="normal" fill="#183f39">The same 42 counters</text><rect x="16" y="445" width="288" height="146" rx="8" fill="#eef5e9" stroke="#7d987d"/><text x="26" y="469" font-size="17" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Pip&#x27;s table</text><text x="26" y="492" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">2 tens · 5 ones</text><rect x="26" y="504" width="58" height="33" rx="5" fill="#f8f7e9" stroke="#7d987d"/><rect x="32" y="510" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="41" y="510" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="50" y="510" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="59" y="510" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="68" y="510" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="32" y="521" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="41" y="521" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="50" y="521" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="59" y="521" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="68" y="521" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="91" y="504" width="58" height="33" rx="5" fill="#f8f7e9" stroke="#7d987d"/><rect x="97" y="510" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="106" y="510" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="115" y="510" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="124" y="510" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="133" y="510" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="97" y="521" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="106" y="521" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="115" y="521" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="124" y="521" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="133" y="521" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="28" y="547" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="43" y="547" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="58" y="547" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="73" y="547" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="88" y="547" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="16" y="603" width="288" height="126" rx="8" fill="#eef4f8" stroke="#4f748f"/><text x="26" y="627" font-size="17" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Store tray</text><text x="26" y="650" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">1 ten · 7 ones</text><rect x="26" y="662" width="58" height="33" rx="5" fill="#eef4f8" stroke="#4f748f"/><rect x="32" y="668" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="41" y="668" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="50" y="668" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="59" y="668" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="68" y="668" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="32" y="679" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="41" y="679" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="50" y="679" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="59" y="679" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="68" y="679" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="28" y="705" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="43" y="705" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="58" y="705" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="73" y="705" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="88" y="705" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="103" y="705" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><rect x="118" y="705" width="7" height="9" rx="1.5" fill="#ddc28e" stroke="#70532d"/><text x="16" y="753" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Together: 42 counters.</text><text x="16" y="782" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">After opening, three tens were</text><text x="16" y="804" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">available. One ten went to the</text><text x="16" y="826" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">store tray. Two tens and five</text><text x="16" y="848" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">ones remain: 25. Both trays</text><text x="16" y="870" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">still account for all 42.</text><text x="16" y="907" font-size="22" font-family="Georgia,serif" font-weight="normal" fill="#183f39">Working groups</text><text x="16" y="931" font-size="18" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">before returning</text><rect x="16" y="946" width="288" height="86" rx="5" fill="#fff0c8" stroke="#c6a46c"/><text x="26" y="970" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">The same 42 can be 3 tens and</text><text x="26" y="992" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">12 ones. Group counts; 12</text><text x="26" y="1014" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">here means twelve loose ones.</text><rect x="16" y="1049" width="288" height="114" rx="0" fill="#fffdf5" stroke="#9bb8a8"/><path d="M16 1079h288" stroke="#9bb8a8"/><path d="M16 1121h288" stroke="#9bb8a8"/><path d="M102 1049v114" stroke="#9bb8a8"/><path d="M203.0 1049v114" stroke="#9bb8a8"/><text x="110" y="1070" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Tens</text><text x="211.0" y="1070" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Ones</text><text x="25" y="1106" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Use</text><text x="25" y="1149" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">− Return</text><text x="144.5" y="1110" font-size="28" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">3</text><text x="239.5" y="1110" font-size="28" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">12</text><text x="144.5" y="1153" font-size="28" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">1</text><text x="245.5" y="1153" font-size="28" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">7</text><text x="16" y="1194" font-size="20" font-family="Georgia,serif" font-weight="normal" fill="#183f39">Digits left on the table</text><rect x="16" y="1212" width="288" height="48" rx="0" fill="#eef5e9" stroke="#7d987d"/><path d="M102 1212v48" stroke="#9bb8a8"/><path d="M203.0 1212v48" stroke="#9bb8a8"/><text x="25" y="1243" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Left</text><text x="144.5" y="1246" font-size="28" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">2</text><text x="245.5" y="1246" font-size="28" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">5</text><text x="16" y="1290" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Supplied writing: 42 − 17 = 25.</text><rect x="16.0" y="1320" width="139.0" height="72" rx="6" fill="#edf1e9" stroke="#a9b9ac"/><text x="26.0" y="1344" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#5b7065">Place the ones</text><text x="26.0" y="1364" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#5b7065">digit from this</text><text x="26.0" y="1384" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#5b7065">picture</text><rect x="165.0" y="1320" width="139.0" height="72" rx="6" fill="#edf1e9" stroke="#a9b9ac"/><text x="175.0" y="1344" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#5b7065">Lift the ones</text><text x="175.0" y="1364" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#5b7065">digit</text><rect x="16.0" y="1402" width="139.0" height="72" rx="6" fill="#edf1e9" stroke="#a9b9ac"/><text x="26.0" y="1426" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#5b7065">Place the tens</text><text x="26.0" y="1446" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#5b7065">digit from this</text><text x="26.0" y="1466" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#5b7065">picture</text><rect x="165.0" y="1402" width="139.0" height="72" rx="6" fill="#183f39" stroke="#183f39"/><text x="175.0" y="1426" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#fffdf5">Lift the tens</text><text x="175.0" y="1446" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#fffdf5">digit</text><rect x="16" y="1498" width="288" height="44" rx="5" fill="#fffdf5" stroke="#7d987d"/><text x="30" y="1526" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">Hear this step</text><text x="16" y="1569" font-size="16" font-family="Trebuchet MS,Arial,sans-serif" font-weight="bold" fill="#183f39">▸ Talk about what changed</text><text x="16" y="1626" font-size="14" font-family="Trebuchet MS,Arial,sans-serif" font-weight="normal" fill="#183f39">Static proposal · no learner record created</text></svg>
