<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1470" viewBox="0 0 390 1470" role="img" aria-labelledby="title desc"><title id="title">Original lantern cutaway teaching model</title><desc id="desc">Four review drawings show one cell, an intact filament bulb with separate side and tip contacts, and selected external wires. Open path, complete path, same-contact paused model, and reversed complete path are distinct. Positions are not standard circuit symbols or measured geometry.</desc><style>text{font-family:Arial,sans-serif;fill:#244139}.head{font-size:19px;font-weight:700}.label{font-size:13px}.small{font-size:11px}.wire{fill:none;stroke:#276b5c;stroke-width:3.5;stroke-linejoin:round}.internal{fill:none;stroke:#936632;stroke-width:2.4}.node{fill:#fff8e9;stroke:#244139;stroke-width:2}</style><rect width="390" height="1470" rx="18" fill="#f5f1e6"/><text x="20" y="32" class="head">One cell. A path through a bulb.</text><text x="20" y="54" class="label">Original review mock · filament bulb, not an LED</text><g transform="translate(18 70)"><rect width="354" height="330" rx="16" fill="#fffdf7" stroke="#aebba8"/><text x="16" y="27" class="head">One connection</text><path class="wire" d="M55 92H110V80H220V143H244"/><rect x="35" y="104" width="40" height="104" rx="6" fill="#dfc99d" stroke="#715b3e" stroke-width="2"/><path d="M55 92V104M55 208V222" class="internal"/><text x="48" y="126" class="head">+</text><text x="48" y="197" class="head">−</text><text x="43" y="163" class="label">cell</text><circle cx="265" cy="94" r="35" fill="#e9ede6" stroke="#715b3e" stroke-width="2"/><path d="M250 122v11h30v-11" fill="none" stroke="#715b3e" stroke-width="2"/><path d="M244 135h42v20h-42z" fill="#a6b8a6" stroke="#526b58"/><rect x="244" y="155" width="42" height="7" fill="#fffdf7" stroke="#526b58"/><path d="M255 162v8h20v-8" fill="#a6b8a6" stroke="#526b58"/><rect x="260" y="129" width="11" height="35" fill="#fffdf7"/><path d="M244 143h8v-37l5-6 5 6 5-6 5 6h5v23h-12v41" class="internal"/><circle cx="55" cy="92" r="4" class="node"/><circle cx="55" cy="222" r="4" class="node"/><circle cx="244" cy="143" r="4" class="node"/><circle cx="265" cy="170" r="4" class="node"/><text x="14" y="84" class="small">cell +</text><text x="14" y="240" class="small">cell −</text><text x="205" y="117" class="small">filament</text><text x="289" y="146" class="small">side</text><text x="288" y="175" class="small">tip</text><text x="211" y="198" class="small">insulating band</text><path d="M255 190L251 159" stroke="#526b58" stroke-width="1"/><text x="16" y="265" class="head">OPEN MODEL</text><text x="16" y="288" class="label">A wire reaches the side; the filament has no</text><text x="16" y="305" class="label">return path.</text></g><g transform="translate(18 412)"><rect width="354" height="330" rx="16" fill="#fffdf7" stroke="#aebba8"/><text x="16" y="27" class="head">Two different contacts</text><path class="wire" d="M55 92H110V80H220V143H244"/><path class="wire" d="M55 222H310V170H265"/><rect x="35" y="104" width="40" height="104" rx="6" fill="#dfc99d" stroke="#715b3e" stroke-width="2"/><path d="M55 92V104M55 208V222" class="internal"/><text x="48" y="126" class="head">+</text><text x="48" y="197" class="head">−</text><text x="43" y="163" class="label">cell</text><circle cx="265" cy="94" r="35" fill="#ffe8a3" stroke="#715b3e" stroke-width="2"/><path d="M250 122v11h30v-11" fill="none" stroke="#715b3e" stroke-width="2"/><path d="M244 135h42v20h-42z" fill="#a6b8a6" stroke="#526b58"/><rect x="244" y="155" width="42" height="7" fill="#fffdf7" stroke="#526b58"/><path d="M255 162v8h20v-8" fill="#a6b8a6" stroke="#526b58"/><rect x="260" y="129" width="11" height="35" fill="#fffdf7"/><path d="M244 143h8v-37l5-6 5 6 5-6 5 6h5v23h-12v41" class="internal"/><circle cx="55" cy="92" r="4" class="node"/><circle cx="55" cy="222" r="4" class="node"/><circle cx="244" cy="143" r="4" class="node"/><circle cx="265" cy="170" r="4" class="node"/><text x="14" y="84" class="small">cell +</text><text x="14" y="240" class="small">cell −</text><text x="205" y="117" class="small">filament</text><text x="289" y="146" class="small">side</text><text x="288" y="175" class="small">tip</text><text x="211" y="198" class="small">insulating band</text><path d="M255 190L251 159" stroke="#526b58" stroke-width="1"/><text x="16" y="265" class="head">GLOW MODEL</text><text x="16" y="288" class="label">The path includes the side, filament and</text><text x="16" y="305" class="label">separate tip.</text></g><g transform="translate(18 754)"><rect width="354" height="330" rx="16" fill="#fffdf7" stroke="#aebba8"/><text x="16" y="27" class="head">Two leads at the same contact</text><path class="wire" d="M55 92H110V80H220V143H244"/><path class="wire" d="M55 222H115V143H244"/><rect x="35" y="104" width="40" height="104" rx="6" fill="#dfc99d" stroke="#715b3e" stroke-width="2"/><path d="M55 92V104M55 208V222" class="internal"/><text x="48" y="126" class="head">+</text><text x="48" y="197" class="head">−</text><text x="43" y="163" class="label">cell</text><circle cx="265" cy="94" r="35" fill="#e9ede6" stroke="#715b3e" stroke-width="2"/><path d="M250 122v11h30v-11" fill="none" stroke="#715b3e" stroke-width="2"/><path d="M244 135h42v20h-42z" fill="#a6b8a6" stroke="#526b58"/><rect x="244" y="155" width="42" height="7" fill="#fffdf7" stroke="#526b58"/><path d="M255 162v8h20v-8" fill="#a6b8a6" stroke="#526b58"/><rect x="260" y="129" width="11" height="35" fill="#fffdf7"/><path d="M244 143h8v-37l5-6 5 6 5-6 5 6h5v23h-12v41" class="internal"/><circle cx="55" cy="92" r="4" class="node"/><circle cx="55" cy="222" r="4" class="node"/><circle cx="244" cy="143" r="4" class="node"/><circle cx="265" cy="170" r="4" class="node"/><text x="14" y="84" class="small">cell +</text><text x="14" y="240" class="small">cell −</text><text x="205" y="117" class="small">filament</text><text x="289" y="146" class="small">side</text><text x="288" y="175" class="small">tip</text><text x="211" y="198" class="small">insulating band</text><path d="M255 190L251 159" stroke="#526b58" stroke-width="1"/><text x="16" y="265" class="head">MODEL PAUSED</text><text x="16" y="288" class="label">A wire-only path joins the cell ends, leaving</text><text x="16" y="305" class="label">out the filament.</text></g><g transform="translate(18 1096)"><rect width="354" height="330" rx="16" fill="#fffdf7" stroke="#aebba8"/><text x="16" y="27" class="head">Reversed cell ends</text><path class="wire" d="M55 92H130V190H265V170"/><path class="wire" d="M55 222H115V143H244"/><path d="M130 135V151" stroke="#fffdf7" stroke-width="9"/><path d="M130 135q12 8 0 16" class="wire"/><rect x="35" y="104" width="40" height="104" rx="6" fill="#dfc99d" stroke="#715b3e" stroke-width="2"/><path d="M55 92V104M55 208V222" class="internal"/><text x="48" y="126" class="head">+</text><text x="48" y="197" class="head">−</text><text x="43" y="163" class="label">cell</text><circle cx="265" cy="94" r="35" fill="#ffe8a3" stroke="#715b3e" stroke-width="2"/><path d="M250 122v11h30v-11" fill="none" stroke="#715b3e" stroke-width="2"/><path d="M244 135h42v20h-42z" fill="#a6b8a6" stroke="#526b58"/><rect x="244" y="155" width="42" height="7" fill="#fffdf7" stroke="#526b58"/><path d="M255 162v8h20v-8" fill="#a6b8a6" stroke="#526b58"/><rect x="260" y="129" width="11" height="35" fill="#fffdf7"/><path d="M244 143h8v-37l5-6 5 6 5-6 5 6h5v23h-12v41" class="internal"/><circle cx="55" cy="92" r="4" class="node"/><circle cx="55" cy="222" r="4" class="node"/><circle cx="244" cy="143" r="4" class="node"/><circle cx="265" cy="170" r="4" class="node"/><text x="14" y="84" class="small">cell +</text><text x="14" y="240" class="small">cell −</text><text x="205" y="117" class="small">filament</text><text x="289" y="146" class="small">side</text><text x="288" y="175" class="small">tip</text><text x="211" y="198" class="small">insulating band</text><path d="M255 190L251 159" stroke="#526b58" stroke-width="1"/><text x="16" y="265" class="head">GLOW MODEL</text><text x="16" y="288" class="label">A filament bulb also works with the two cell</text><text x="16" y="305" class="label">ends reversed.</text></g><text x="20" y="1457" class="small">Screen connections only; no measured current, heat or brightness.</text></svg>