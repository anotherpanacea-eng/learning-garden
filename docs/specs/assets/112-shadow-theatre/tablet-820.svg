<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1683" viewBox="0 0 820 1683" role="img" aria-labelledby="title desc"><title id="title">Shadow Theatre — 820 static proposal</title><desc id="desc">Original 820 static proposal, card near the screen, light paths shown. Fixed ideal point lamp and parallel screen. The same opaque card makes the smallest of three shadow sizes. Side/front views share exact projection; edge paths graze the card and center path stops at it. These are explanatory drawings, not observed measurements.</desc><rect width="820" height="1683" fill="#f6f8ef"/><g font-family="Trebuchet MS, Verdana, sans-serif" fill="#183f39"><text x="32" y="34" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">← Story Loft</text><text x="32" y="80" font-size="30" font-weight="400" text-anchor="start" fill="#183f39" font-family="Georgia, serif">Shadow Theatre</text><text x="32" y="117" font-size="19" font-weight="700" text-anchor="start" fill="#183f39">Move one card. What changes on the screen?</text><text x="32" y="148" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">Give the same stage card a bigger shadow for its entrance and a smaller shadow for its</text><text x="32" y="171" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">exit.</text><rect x="32" y="211" width="756" height="69" rx="8" fill="#eee8f2"/><text x="44" y="236" font-size="19" font-weight="700" text-anchor="start" fill="#183f39">Near the screen</text><text x="44" y="262" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">Card near the screen. The same card makes the smallest shadow in this model.</text><rect x="32" y="304" width="372.0" height="66" rx="10" fill="#fffdf5" stroke="#695477" stroke-width="1"/><text x="218.0" y="341" font-size="16" font-weight="700" text-anchor="middle" fill="#183f39">Move card toward lamp</text><rect x="416.0" y="304" width="372.0" height="66" rx="10" fill="#edf0ea" stroke="#b1c2b3" stroke-width="1"/><text x="602.0" y="341" font-size="16" font-weight="700" text-anchor="middle" fill="#183f39">Move card toward screen</text><text x="32" y="394" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">The card is already at this end.</text><rect x="32" y="424" width="372.0" height="66" rx="10" fill="#fffdf5" stroke="#695477" stroke-width="1"/><text x="218.0" y="461" font-size="16" font-weight="700" text-anchor="middle" fill="#183f39">Remove card</text><rect x="416.0" y="424" width="372.0" height="66" rx="10" fill="#fffdf5" stroke="#695477" stroke-width="3"/><text x="602.0" y="449" font-size="16" font-weight="700" text-anchor="middle" fill="#183f39">Light paths</text><text x="602.0" y="480" font-size="16" font-weight="700" text-anchor="middle" fill="#183f39">✓ Shown</text><rect x="32" y="504" width="756" height="66" rx="10" fill="#fffdf5" stroke="#695477" stroke-width="1"/><text x="410.0" y="541" font-size="16" font-weight="700" text-anchor="middle" fill="#183f39">Undo last change</text><rect x="32" y="592" width="20" height="30" rx="0" fill="#695477"/><text x="64" y="610" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">The same card</text><text x="64" y="633" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">Key, not to scale.</text><rect x="32" y="657" width="368.0" height="385" rx="12" fill="#fffdf5" stroke="#b1c2b3" stroke-width="1"/><text x="48" y="687" font-size="21" font-weight="700" text-anchor="start" fill="#183f39">Side view</text><path d="M345.6 719L345.6 978.2" stroke="#b1c2b3" stroke-width="6" fill="none"/><path d="M345.6 800.0L345.6 897.2" stroke="#263731" stroke-width="6" fill="none"/><path d="M86.39999999999998 996.2L345.6 996.2" stroke="#b1c2b3" stroke-width="2" fill="none"/><path d="M172.79999999999998 991.2L172.79999999999998 1001.2" stroke="#b1c2b3" stroke-width="2" fill="none"/><path d="M216.0 991.2L216.0 1001.2" stroke="#b1c2b3" stroke-width="2" fill="none"/><path d="M259.2 991.2L259.2 1001.2" stroke="#b1c2b3" stroke-width="2" fill="none"/><path d="M86.39999999999998 848.6L345.6 800.0" stroke="#9a5f14" stroke-width="2" fill="none"/><path d="M296.98060796848085 812.5305970262151L302.40000000000003 808.1L295.74367114603064 805.933600639814" stroke="#9a5f14" stroke-width="2" fill="none"/><path d="M86.39999999999998 848.6L345.6 897.2" stroke="#9a5f14" stroke-width="2" fill="none"/><path d="M295.74367114603064 891.266399360186L302.40000000000003 889.1L296.98060796848085 884.6694029737849" stroke="#9a5f14" stroke-width="2" fill="none"/><path d="M86.39999999999998 848.6L259.2 848.6" stroke="#9a5f14" stroke-width="2" fill="none"/><path d="M171.84092206676738 851.9559787702294L177.98399999999998 848.6L171.84092206676738 845.2440212297706" stroke="#9a5f14" stroke-width="2" fill="none"/><path d="M255.2 844.6L263.2 852.6" stroke="#183f39" stroke-width="2" fill="none"/><path d="M255.2 852.6L263.2 844.6" stroke="#183f39" stroke-width="2" fill="none"/><path d="M259.2 816.2L259.2 881.0" stroke="#695477" stroke-width="6" fill="none"/><circle cx="86.39999999999998" cy="848.6" r="5" fill="#e9b84a" stroke="#183f39" stroke-width="1.5"/><text x="48" y="825.6" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">Lamp</text><text x="384.0" y="710" font-size="16" font-weight="700" text-anchor="end" fill="#183f39">Screen</text><text x="48" y="1022" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">Card seen edge-on</text><rect x="420.0" y="657" width="368.0" height="435" rx="12" fill="#fffdf5" stroke="#b1c2b3" stroke-width="1"/><text x="436.0" y="687" font-size="21" font-weight="700" text-anchor="start" fill="#183f39">Screen from the front</text><rect x="474.4" y="719" width="259.20000000000005" height="259.20000000000005" rx="0" fill="#f6efd9" stroke="#b1c2b3" stroke-width="2"/><rect x="571.6" y="800.0" width="64.80000000000001" height="97.2" rx="0" fill="#263731"/><text x="436.0" y="1022" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">Shadow on this screen</text><text x="436.0" y="1047" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">Card omitted here so the whole screen</text><text x="436.0" y="1070" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">is visible.</text><text x="32" y="1117" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">Two views of one lamp, one card and one screen.</text><text x="32" y="1155" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">These lines are selected paths from the lamp, not every light path. Arrows show the</text><text x="32" y="1178" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">direction of light.</text><text x="32" y="1211" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">The middle path stops at the opaque card. The outer paths mark the shadow’s top and</text><text x="32" y="1234" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">bottom edges.</text><rect x="32" y="1272" width="756" height="66" rx="10" fill="#fffdf5" stroke="#695477" stroke-width="1"/><text x="410.0" y="1309" font-size="16" font-weight="700" text-anchor="middle" fill="#183f39">Hear this picture</text><text x="32" y="1363" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">A simplified light picture: one tiny point source, one opaque card and a flat screen.</text><text x="32" y="1386" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">The lamp and screen stay fixed. Real lamps and rooms can make softer, lighter-edged</text><text x="32" y="1409" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">shadows.</text><text x="32" y="1448" font-size="18" font-weight="700" text-anchor="start" fill="#183f39">▾ About this light picture</text><text x="32" y="1477" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">Opaque means light does not pass through this card. Light from our point source travels</text><text x="32" y="1500" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">along straight paths. The card blocks some paths to the screen. The dark rectangle is a</text><text x="32" y="1523" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">place on the screen receiving no direct light from that source; it is not a dark object</text><text x="32" y="1546" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">traveling from the card. Real rooms can add reflected light, and real lamps have size.</text><text x="32" y="1569" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">This picture leaves those effects out.</text><text x="32" y="1612" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">Return to Story Loft</text><text x="32" y="1649" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">Visit Bell Studio</text></g></svg>
