<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1595" viewBox="0 0 820 1595" role="img" aria-labelledby="title desc"><title id="title">Shadow Theatre — 820 static proposal</title><desc id="desc">Original 820 static proposal, card near the screen, light paths shown. Fixed ideal point lamp and parallel screen. The same opaque card makes the smallest of three shadow sizes. Side/front views share exact projection; edge paths graze the card and center path stops at it. These are explanatory drawings, not observed measurements.</desc><rect width="820" height="1595" fill="#f6f8ef"/><g font-family="Trebuchet MS, Verdana, sans-serif" fill="#183f39"><text x="32" y="34" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">← Story Loft</text><text x="32" y="80" font-size="30" font-weight="400" text-anchor="start" fill="#183f39" font-family="Georgia, serif">Shadow Theatre</text><text x="32" y="117" font-size="19" font-weight="700" text-anchor="start" fill="#183f39">Move one card. What changes on the screen?</text><text x="32" y="148" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">Give the same stage card a bigger entrance and a smaller exit.</text><rect x="32" y="188" width="756" height="69" rx="8" fill="#eee8f2"/><text x="44" y="213" font-size="19" font-weight="700" text-anchor="start" fill="#183f39">Near the screen</text><text x="44" y="239" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">Card near the screen. The same card makes the smallest shadow in this model.</text><rect x="32" y="281" width="372.0" height="66" rx="10" fill="#fffdf5" stroke="#695477" stroke-width="1"/><text x="218.0" y="318" font-size="16" font-weight="700" text-anchor="middle" fill="#183f39">Move card toward lamp</text><rect x="416.0" y="281" width="372.0" height="66" rx="10" fill="#edf0ea" stroke="#b1c2b3" stroke-width="1"/><text x="602.0" y="318" font-size="16" font-weight="700" text-anchor="middle" fill="#183f39">Move card toward screen</text><text x="32" y="371" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">The card is already at this end.</text><rect x="32" y="401" width="372.0" height="66" rx="10" fill="#fffdf5" stroke="#695477" stroke-width="1"/><text x="218.0" y="438" font-size="16" font-weight="700" text-anchor="middle" fill="#183f39">Remove card</text><rect x="416.0" y="401" width="372.0" height="66" rx="10" fill="#fffdf5" stroke="#695477" stroke-width="3"/><text x="602.0" y="426" font-size="16" font-weight="700" text-anchor="middle" fill="#183f39">Hide light paths</text><text x="602.0" y="457" font-size="16" font-weight="700" text-anchor="middle" fill="#183f39">✓ Shown</text><rect x="32" y="481" width="756" height="66" rx="10" fill="#fffdf5" stroke="#695477" stroke-width="1"/><text x="410.0" y="518" font-size="16" font-weight="700" text-anchor="middle" fill="#183f39">Undo last change</text><rect x="32" y="569" width="20" height="30" rx="0" fill="#695477"/><text x="64" y="591" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">The same card</text><rect x="32" y="619" width="368.0" height="385" rx="12" fill="#fffdf5" stroke="#b1c2b3" stroke-width="1"/><text x="48" y="649" font-size="21" font-weight="700" text-anchor="start" fill="#183f39">Side view</text><path d="M345.6 681L345.6 940.2" stroke="#b1c2b3" stroke-width="6" fill="none"/><path d="M345.6 762.0L345.6 859.2" stroke="#263731" stroke-width="6" fill="none"/><path d="M86.39999999999998 958.2L345.6 958.2" stroke="#b1c2b3" stroke-width="2" fill="none"/><path d="M172.79999999999998 953.2L172.79999999999998 963.2" stroke="#b1c2b3" stroke-width="2" fill="none"/><path d="M216.0 953.2L216.0 963.2" stroke="#b1c2b3" stroke-width="2" fill="none"/><path d="M259.2 953.2L259.2 963.2" stroke="#b1c2b3" stroke-width="2" fill="none"/><path d="M86.39999999999998 810.6L345.6 762.0" stroke="#9a5f14" stroke-width="2" fill="none"/><path d="M163.92460796848079 799.4785970262151L169.344 795.048L162.6876711460306 792.881600639814" stroke="#9a5f14" stroke-width="2" fill="none"/><path d="M86.39999999999998 810.6L345.6 859.2" stroke="#9a5f14" stroke-width="2" fill="none"/><path d="M162.6876711460306 828.318399360186L169.344 826.152L163.92460796848079 821.721402973785" stroke="#9a5f14" stroke-width="2" fill="none"/><path d="M86.39999999999998 810.6L259.2 810.6" stroke="#9a5f14" stroke-width="2" fill="none"/><path d="M171.84092206676738 813.9559787702294L177.98399999999998 810.6L171.84092206676738 807.2440212297706" stroke="#9a5f14" stroke-width="2" fill="none"/><path d="M255.2 806.6L263.2 814.6" stroke="#183f39" stroke-width="2" fill="none"/><path d="M255.2 814.6L263.2 806.6" stroke="#183f39" stroke-width="2" fill="none"/><path d="M259.2 778.2L259.2 843.0" stroke="#695477" stroke-width="6" fill="none"/><circle cx="86.39999999999998" cy="810.6" r="5" fill="#e9b84a" stroke="#183f39" stroke-width="1.5"/><text x="48" y="787.6" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">Lamp</text><text x="384.0" y="672" font-size="16" font-weight="700" text-anchor="end" fill="#183f39">Screen</text><text x="48" y="984" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">Card seen edge-on</text><rect x="420.0" y="619" width="368.0" height="385" rx="12" fill="#fffdf5" stroke="#b1c2b3" stroke-width="1"/><text x="436.0" y="649" font-size="21" font-weight="700" text-anchor="start" fill="#183f39">Screen from the front</text><rect x="474.4" y="681" width="259.20000000000005" height="259.20000000000005" rx="0" fill="#f6efd9" stroke="#b1c2b3" stroke-width="2"/><rect x="571.6" y="762.0" width="64.80000000000001" height="97.2" rx="0" fill="#263731"/><text x="436.0" y="984" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">Shadow on this screen</text><text x="32" y="1029" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">Two views of one lamp, one card and one screen.</text><text x="32" y="1067" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">These lines are selected paths from the lamp, not every light path. Arrows show the</text><text x="32" y="1090" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">direction of light.</text><text x="32" y="1123" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">The middle path stops at the opaque card. The outer paths mark the shadow’s top and</text><text x="32" y="1146" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">bottom edges.</text><rect x="32" y="1184" width="756" height="66" rx="10" fill="#fffdf5" stroke="#695477" stroke-width="1"/><text x="410.0" y="1221" font-size="16" font-weight="700" text-anchor="middle" fill="#183f39">Hear this picture</text><text x="32" y="1275" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">A simplified light picture: one tiny point source, one opaque card and a flat screen.</text><text x="32" y="1298" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">The lamp and screen stay fixed. Real lamps and rooms can make softer, lighter-edged</text><text x="32" y="1321" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">shadows.</text><text x="32" y="1360" font-size="18" font-weight="700" text-anchor="start" fill="#183f39">▾ About this light picture</text><text x="32" y="1389" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">Opaque means light does not pass through this card. Light from our point source travels</text><text x="32" y="1412" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">along straight paths. The card blocks some paths to the screen. The dark rectangle is a</text><text x="32" y="1435" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">place on the screen receiving no direct light from that source; it is not a dark object</text><text x="32" y="1458" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">traveling from the card. Real rooms can add reflected light, and real lamps have size.</text><text x="32" y="1481" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">This picture leaves those effects out.</text><text x="32" y="1524" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">Return to Story Loft</text><text x="32" y="1561" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">Visit Bell Studio</text></g></svg>
