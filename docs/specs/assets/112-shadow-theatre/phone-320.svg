<svg xmlns="http://www.w3.org/2000/svg" width="320" height="2452" viewBox="0 0 320 2452" role="img" aria-labelledby="title desc"><title id="title">Shadow Theatre — 320 static proposal</title><desc id="desc">Original 320 static proposal, card near the lamp, light paths shown. Fixed ideal point lamp and parallel screen. The same opaque card makes the largest of three shadow sizes. Side/front views share exact projection; edge paths graze the card and center path stops at it. These are explanatory drawings, not observed measurements.</desc><rect width="320" height="2452" fill="#f6f8ef"/><g font-family="Trebuchet MS, Verdana, sans-serif" fill="#183f39"><text x="16" y="34" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">← Story Loft</text><text x="16" y="80" font-size="30" font-weight="400" text-anchor="start" fill="#183f39" font-family="Georgia, serif">Shadow Theatre</text><text x="16" y="117" font-size="19" font-weight="700" text-anchor="start" fill="#183f39">Move one card. What changes</text><text x="16" y="140" font-size="19" font-weight="700" text-anchor="start" fill="#183f39">on the screen?</text><text x="16" y="171" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">Give the same stage card a bigger</text><text x="16" y="194" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">shadow for its entrance and a</text><text x="16" y="217" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">smaller shadow for its exit.</text><rect x="16" y="257" width="288" height="118" rx="8" fill="#eee8f2"/><text x="28" y="282" font-size="19" font-weight="700" text-anchor="start" fill="#183f39">Near the lamp</text><text x="28" y="308" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">Card near the lamp. The same</text><text x="28" y="331" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">card makes the largest shadow</text><text x="28" y="354" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">in this model.</text><rect x="16" y="396" width="138.0" height="66" rx="10" fill="#edf0ea" stroke="#b1c2b3" stroke-width="1"/><text x="85.0" y="421" font-size="16" font-weight="700" text-anchor="middle" fill="#183f39">Move card toward</text><text x="85.0" y="442" font-size="16" font-weight="700" text-anchor="middle" fill="#183f39">lamp</text><rect x="166.0" y="396" width="138.0" height="66" rx="10" fill="#fffdf5" stroke="#695477" stroke-width="1"/><text x="235.0" y="421" font-size="16" font-weight="700" text-anchor="middle" fill="#183f39">Move card toward</text><text x="235.0" y="442" font-size="16" font-weight="700" text-anchor="middle" fill="#183f39">screen</text><text x="16" y="486" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">The card is already at this end.</text><rect x="16" y="516" width="138.0" height="66" rx="10" fill="#fffdf5" stroke="#695477" stroke-width="1"/><text x="85.0" y="553" font-size="16" font-weight="700" text-anchor="middle" fill="#183f39">Remove card</text><rect x="166.0" y="516" width="138.0" height="66" rx="10" fill="#fffdf5" stroke="#695477" stroke-width="3"/><text x="235.0" y="541" font-size="16" font-weight="700" text-anchor="middle" fill="#183f39">Light paths</text><text x="235.0" y="572" font-size="16" font-weight="700" text-anchor="middle" fill="#183f39">✓ Shown</text><rect x="16" y="596" width="288" height="66" rx="10" fill="#fffdf5" stroke="#695477" stroke-width="1"/><text x="160.0" y="633" font-size="16" font-weight="700" text-anchor="middle" fill="#183f39">Undo last change</text><rect x="16" y="684" width="20" height="30" rx="0" fill="#695477"/><text x="48" y="702" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">The same card</text><text x="48" y="725" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">Key, not to scale.</text><rect x="16" y="749" width="288" height="340" rx="12" fill="#fffdf5" stroke="#b1c2b3" stroke-width="1"/><text x="32" y="779" font-size="21" font-weight="700" text-anchor="start" fill="#183f39">Side view</text><path d="M268.0 811L268.0 1027.0" stroke="#b1c2b3" stroke-width="6" fill="none"/><path d="M268.0 838.0L268.0 1000.0" stroke="#263731" stroke-width="6" fill="none"/><path d="M52.0 1045.0L268.0 1045.0" stroke="#b1c2b3" stroke-width="2" fill="none"/><path d="M124.0 1040.0L124.0 1050.0" stroke="#b1c2b3" stroke-width="2" fill="none"/><path d="M160.0 1040.0L160.0 1050.0" stroke="#b1c2b3" stroke-width="2" fill="none"/><path d="M196.0 1040.0L196.0 1050.0" stroke="#b1c2b3" stroke-width="2" fill="none"/><path d="M52.0 919.0L268.0 838.0" stroke="#9a5f14" stroke-width="2" fill="none"/><path d="M191.4264197067343 870.2992795077304L196.0 865.0L189.06969407533325 864.0146778239942" stroke="#9a5f14" stroke-width="2" fill="none"/><path d="M52.0 919.0L268.0 1000.0" stroke="#9a5f14" stroke-width="2" fill="none"/><path d="M189.06969407533325 973.9853221760058L196.0 973.0L191.4264197067343 967.7007204922696" stroke="#9a5f14" stroke-width="2" fill="none"/><path d="M52.0 919.0L124.0 919.0" stroke="#9a5f14" stroke-width="2" fill="none"/><path d="M84.01692206676739 922.3559787702294L90.16 919.0L84.01692206676739 915.6440212297706" stroke="#9a5f14" stroke-width="2" fill="none"/><path d="M120.0 915.0L128.0 923.0" stroke="#183f39" stroke-width="2" fill="none"/><path d="M120.0 923.0L128.0 915.0" stroke="#183f39" stroke-width="2" fill="none"/><path d="M124.0 892.0L124.0 946.0" stroke="#695477" stroke-width="6" fill="none"/><circle cx="52.0" cy="919.0" r="5" fill="#e9b84a" stroke="#183f39" stroke-width="1.5"/><text x="32" y="896.0" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">Lamp</text><text x="288" y="802" font-size="16" font-weight="700" text-anchor="end" fill="#183f39">Screen</text><text x="32" y="1069" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">Card seen edge-on</text><rect x="16" y="1103" width="288" height="390" rx="12" fill="#fffdf5" stroke="#b1c2b3" stroke-width="1"/><text x="32" y="1133" font-size="21" font-weight="700" text-anchor="start" fill="#183f39">Screen from the front</text><rect x="52.0" y="1165" width="216.0" height="216.0" rx="0" fill="#f6efd9" stroke="#b1c2b3" stroke-width="2"/><rect x="106.0" y="1192.0" width="108.0" height="162.0" rx="0" fill="#263731"/><text x="32" y="1423" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">Shadow on this screen</text><text x="32" y="1448" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">Card omitted here so the</text><text x="32" y="1471" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">whole screen is visible.</text><text x="16" y="1518" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">Two views of one lamp, one card</text><text x="16" y="1541" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">and one screen.</text><text x="16" y="1579" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">These lines are selected paths</text><text x="16" y="1602" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">from the lamp, not every light</text><text x="16" y="1625" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">path. Arrows show the direction</text><text x="16" y="1648" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">of light.</text><text x="16" y="1681" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">The middle path stops at the</text><text x="16" y="1704" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">opaque card. The outer paths mark</text><text x="16" y="1727" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">the shadow’s top and bottom</text><text x="16" y="1750" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">edges.</text><rect x="16" y="1788" width="288" height="66" rx="10" fill="#fffdf5" stroke="#695477" stroke-width="1"/><text x="160.0" y="1825" font-size="16" font-weight="700" text-anchor="middle" fill="#183f39">Hear this picture</text><text x="16" y="1879" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">A simplified light picture: one</text><text x="16" y="1902" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">tiny point source, one opaque</text><text x="16" y="1925" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">card and a flat screen. The lamp</text><text x="16" y="1948" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">and screen stay fixed. Real lamps</text><text x="16" y="1971" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">and rooms can make softer,</text><text x="16" y="1994" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">lighter-edged shadows.</text><text x="16" y="2033" font-size="18" font-weight="700" text-anchor="start" fill="#183f39">▾ About this light picture</text><text x="16" y="2062" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">Opaque means light does not pass</text><text x="16" y="2085" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">through this card. Light from our</text><text x="16" y="2108" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">point source travels along</text><text x="16" y="2131" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">straight paths. The card blocks</text><text x="16" y="2154" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">some paths to the screen. The</text><text x="16" y="2177" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">dark rectangle is a place on the</text><text x="16" y="2200" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">screen receiving no direct light</text><text x="16" y="2223" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">from that source; it is not a</text><text x="16" y="2246" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">dark object traveling from the</text><text x="16" y="2269" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">card. Real rooms can add</text><text x="16" y="2292" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">reflected light, and real lamps</text><text x="16" y="2315" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">have size. This picture leaves</text><text x="16" y="2338" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">those effects out.</text><text x="16" y="2381" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">Return to Story Loft</text><text x="16" y="2418" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">Visit Bell Studio</text></g></svg>
