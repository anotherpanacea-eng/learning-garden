<svg xmlns="http://www.w3.org/2000/svg" width="320" height="2364" viewBox="0 0 320 2364" role="img" aria-labelledby="title desc"><title id="title">Shadow Theatre — 320 static proposal</title><desc id="desc">Original 320 static proposal, card near the lamp, light paths shown. Fixed ideal point lamp and parallel screen. The same opaque card makes the largest of three shadow sizes. Side/front views share exact projection; edge paths graze the card and center path stops at it. These are explanatory drawings, not observed measurements.</desc><rect width="320" height="2364" fill="#f6f8ef"/><g font-family="Trebuchet MS, Verdana, sans-serif" fill="#183f39"><text x="16" y="34" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">← Story Loft</text><text x="16" y="80" font-size="30" font-weight="400" text-anchor="start" fill="#183f39" font-family="Georgia, serif">Shadow Theatre</text><text x="16" y="117" font-size="19" font-weight="700" text-anchor="start" fill="#183f39">Move one card. What changes</text><text x="16" y="140" font-size="19" font-weight="700" text-anchor="start" fill="#183f39">on the screen?</text><text x="16" y="171" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">Give the same stage card a bigger</text><text x="16" y="194" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">entrance and a smaller exit.</text><rect x="16" y="234" width="288" height="118" rx="8" fill="#eee8f2"/><text x="28" y="259" font-size="19" font-weight="700" text-anchor="start" fill="#183f39">Near the lamp</text><text x="28" y="285" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">Card near the lamp. The same</text><text x="28" y="308" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">card makes the largest shadow</text><text x="28" y="331" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">in this model.</text><rect x="16" y="373" width="138.0" height="66" rx="10" fill="#edf0ea" stroke="#b1c2b3" stroke-width="1"/><text x="85.0" y="398" font-size="16" font-weight="700" text-anchor="middle" fill="#183f39">Move card toward</text><text x="85.0" y="419" font-size="16" font-weight="700" text-anchor="middle" fill="#183f39">lamp</text><rect x="166.0" y="373" width="138.0" height="66" rx="10" fill="#fffdf5" stroke="#695477" stroke-width="1"/><text x="235.0" y="398" font-size="16" font-weight="700" text-anchor="middle" fill="#183f39">Move card toward</text><text x="235.0" y="419" font-size="16" font-weight="700" text-anchor="middle" fill="#183f39">screen</text><text x="16" y="463" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">The card is already at this end.</text><rect x="16" y="493" width="138.0" height="66" rx="10" fill="#fffdf5" stroke="#695477" stroke-width="1"/><text x="85.0" y="530" font-size="16" font-weight="700" text-anchor="middle" fill="#183f39">Remove card</text><rect x="166.0" y="493" width="138.0" height="66" rx="10" fill="#fffdf5" stroke="#695477" stroke-width="3"/><text x="235.0" y="518" font-size="16" font-weight="700" text-anchor="middle" fill="#183f39">Hide light paths</text><text x="235.0" y="549" font-size="16" font-weight="700" text-anchor="middle" fill="#183f39">✓ Shown</text><rect x="16" y="573" width="288" height="66" rx="10" fill="#fffdf5" stroke="#695477" stroke-width="1"/><text x="160.0" y="610" font-size="16" font-weight="700" text-anchor="middle" fill="#183f39">Undo last change</text><rect x="16" y="661" width="20" height="30" rx="0" fill="#695477"/><text x="48" y="683" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">The same card</text><rect x="16" y="711" width="288" height="340" rx="12" fill="#fffdf5" stroke="#b1c2b3" stroke-width="1"/><text x="32" y="741" font-size="21" font-weight="700" text-anchor="start" fill="#183f39">Side view</text><path d="M268.0 773L268.0 989.0" stroke="#b1c2b3" stroke-width="6" fill="none"/><path d="M268.0 800.0L268.0 962.0" stroke="#263731" stroke-width="6" fill="none"/><path d="M52.0 1007.0L268.0 1007.0" stroke="#b1c2b3" stroke-width="2" fill="none"/><path d="M124.0 1002.0L124.0 1012.0" stroke="#b1c2b3" stroke-width="2" fill="none"/><path d="M160.0 1002.0L160.0 1012.0" stroke="#b1c2b3" stroke-width="2" fill="none"/><path d="M196.0 1002.0L196.0 1012.0" stroke="#b1c2b3" stroke-width="2" fill="none"/><path d="M52.0 881.0L268.0 800.0" stroke="#9a5f14" stroke-width="2" fill="none"/><path d="M116.5464197067343 860.3792795077304L121.12 855.08L114.18969407533324 854.0946778239943" stroke="#9a5f14" stroke-width="2" fill="none"/><path d="M52.0 881.0L268.0 962.0" stroke="#9a5f14" stroke-width="2" fill="none"/><path d="M114.18969407533324 907.9053221760057L121.12 906.92L116.5464197067343 901.6207204922696" stroke="#9a5f14" stroke-width="2" fill="none"/><path d="M52.0 881.0L124.0 881.0" stroke="#9a5f14" stroke-width="2" fill="none"/><path d="M84.01692206676739 884.3559787702294L90.16 881.0L84.01692206676739 877.6440212297706" stroke="#9a5f14" stroke-width="2" fill="none"/><path d="M120.0 877.0L128.0 885.0" stroke="#183f39" stroke-width="2" fill="none"/><path d="M120.0 885.0L128.0 877.0" stroke="#183f39" stroke-width="2" fill="none"/><path d="M124.0 854.0L124.0 908.0" stroke="#695477" stroke-width="6" fill="none"/><circle cx="52.0" cy="881.0" r="5" fill="#e9b84a" stroke="#183f39" stroke-width="1.5"/><text x="32" y="858.0" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">Lamp</text><text x="288" y="764" font-size="16" font-weight="700" text-anchor="end" fill="#183f39">Screen</text><text x="32" y="1031" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">Card seen edge-on</text><rect x="16" y="1065" width="288" height="340" rx="12" fill="#fffdf5" stroke="#b1c2b3" stroke-width="1"/><text x="32" y="1095" font-size="21" font-weight="700" text-anchor="start" fill="#183f39">Screen from the front</text><rect x="52.0" y="1127" width="216.0" height="216.0" rx="0" fill="#f6efd9" stroke="#b1c2b3" stroke-width="2"/><rect x="106.0" y="1154.0" width="108.0" height="162.0" rx="0" fill="#263731"/><text x="32" y="1385" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">Shadow on this screen</text><text x="16" y="1430" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">Two views of one lamp, one card</text><text x="16" y="1453" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">and one screen.</text><text x="16" y="1491" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">These lines are selected paths</text><text x="16" y="1514" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">from the lamp, not every light</text><text x="16" y="1537" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">path. Arrows show the direction</text><text x="16" y="1560" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">of light.</text><text x="16" y="1593" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">The middle path stops at the</text><text x="16" y="1616" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">opaque card. The outer paths mark</text><text x="16" y="1639" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">the shadow’s top and bottom</text><text x="16" y="1662" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">edges.</text><rect x="16" y="1700" width="288" height="66" rx="10" fill="#fffdf5" stroke="#695477" stroke-width="1"/><text x="160.0" y="1737" font-size="16" font-weight="700" text-anchor="middle" fill="#183f39">Hear this picture</text><text x="16" y="1791" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">A simplified light picture: one</text><text x="16" y="1814" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">tiny point source, one opaque</text><text x="16" y="1837" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">card and a flat screen. The lamp</text><text x="16" y="1860" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">and screen stay fixed. Real lamps</text><text x="16" y="1883" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">and rooms can make softer,</text><text x="16" y="1906" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">lighter-edged shadows.</text><text x="16" y="1945" font-size="18" font-weight="700" text-anchor="start" fill="#183f39">▾ About this light picture</text><text x="16" y="1974" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">Opaque means light does not pass</text><text x="16" y="1997" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">through this card. Light from our</text><text x="16" y="2020" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">point source travels along</text><text x="16" y="2043" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">straight paths. The card blocks</text><text x="16" y="2066" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">some paths to the screen. The</text><text x="16" y="2089" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">dark rectangle is a place on the</text><text x="16" y="2112" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">screen receiving no direct light</text><text x="16" y="2135" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">from that source; it is not a</text><text x="16" y="2158" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">dark object traveling from the</text><text x="16" y="2181" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">card. Real rooms can add</text><text x="16" y="2204" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">reflected light, and real lamps</text><text x="16" y="2227" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">have size. This picture leaves</text><text x="16" y="2250" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">those effects out.</text><text x="16" y="2293" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">Return to Story Loft</text><text x="16" y="2330" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">Visit Bell Studio</text></g></svg>
