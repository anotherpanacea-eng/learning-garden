<svg xmlns="http://www.w3.org/2000/svg" width="320" height="2015.64" viewBox="0 0 320 2015.64" role="img" aria-labelledby="title desc"><title id="title">Same route, different scale — 320 static proposal</title><desc id="desc">Static open-comparison proposal at 2 m selected. Both equal-pitch grids show the same invented route: Post Office to Garden, 8 meters east then 4 meters north, 12 meters total. The 2-meter key draws four east and two north edges; the 4-meter key draws two east and one north edge. Neither physical route nor destination has changed.</desc><rect width="320" height="2015.64" fill="#f6f8ef"/><g font-family="Trebuchet MS, Verdana, sans-serif" fill="#183f39"><text x="16" y="35" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">← Cartographer’s Table</text><text x="16" y="80" font-size="28" font-weight="700" text-anchor="start" fill="#183f39">Same route,</text><text x="16" y="114" font-size="28" font-weight="700" text-anchor="start" fill="#183f39">different scale</text><text x="16" y="147" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">The visitor wants a smaller</text><text x="16" y="170" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">drawing of the same route. Try</text><text x="16" y="193" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">another edge key, then compare</text><text x="16" y="216" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">the maps.</text><rect x="16" y="249" width="288" height="169" rx="10" fill="#edf4e8"/><text x="30" y="274" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">Invented town route: Post</text><text x="30" y="297" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">Office → Garden. Go 8 m east,</text><text x="30" y="320" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">then 4 m north. The route is</text><text x="30" y="343" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">12 m long.</text><text x="30" y="373" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">Our purpose: change the</text><text x="30" y="396" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">drawing, keep the route.</text><text x="16" y="439" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">Invented distances, not a real</text><text x="16" y="462" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">journey. These drawings cannot</text><text x="16" y="485" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">predict real travel. Screen edges</text><text x="16" y="508" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">are not measured centimeters.</text><rect x="16" y="549" width="138.0" height="58" rx="10" fill="#edf4e8" stroke="#235d42" stroke-width="3"/><text x="85.0" y="573" font-size="16" font-weight="700" text-anchor="middle" fill="#183f39">2 m per edge</text><text x="85.0" y="595" font-size="16" font-weight="700" text-anchor="middle" fill="#183f39">✓ Selected</text><rect x="166.0" y="549" width="138.0" height="58" rx="10" fill="#fffdf5" stroke="#235d42" stroke-width="1"/><text x="235.0" y="573" font-size="16" font-weight="700" text-anchor="middle" fill="#183f39">4 m per edge</text><rect x="16" y="621" width="288" height="58" rx="10" fill="#fffdf5" stroke="#235d42" stroke-width="1"/><text x="160.0" y="645" font-size="16" font-weight="700" text-anchor="middle" fill="#183f39">Show one map</text><rect x="16" y="691" width="288" height="58" rx="10" fill="#fffdf5" stroke="#235d42" stroke-width="1"/><text x="160.0" y="715" font-size="16" font-weight="700" text-anchor="middle" fill="#183f39">Undo last change</text><rect x="16" y="768" width="288" height="474" rx="14" fill="#fffdf5" stroke="#b1c2b3" stroke-width="2"/><text x="32" y="799" font-size="19" font-weight="700" text-anchor="start" fill="#183f39">1 edge represents 2 m</text><text x="32" y="830.32" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">↑ North</text><path d="M50.0 850.32L50.0 982.32" stroke="#b1c2b3" stroke-width="1" fill="none"/><path d="M94.0 850.32L94.0 982.32" stroke="#b1c2b3" stroke-width="1" fill="none"/><path d="M138.0 850.32L138.0 982.32" stroke="#b1c2b3" stroke-width="1" fill="none"/><path d="M182.0 850.32L182.0 982.32" stroke="#b1c2b3" stroke-width="1" fill="none"/><path d="M226.0 850.32L226.0 982.32" stroke="#b1c2b3" stroke-width="1" fill="none"/><path d="M270.0 850.32L270.0 982.32" stroke="#b1c2b3" stroke-width="1" fill="none"/><path d="M50.0 850.32L270.0 850.32" stroke="#b1c2b3" stroke-width="1" fill="none"/><path d="M50.0 894.32L270.0 894.32" stroke="#b1c2b3" stroke-width="1" fill="none"/><path d="M50.0 938.32L270.0 938.32" stroke="#b1c2b3" stroke-width="1" fill="none"/><path d="M50.0 982.32L270.0 982.32" stroke="#b1c2b3" stroke-width="1" fill="none"/><polyline points="50.0,982.32 94.0,982.32 138.0,982.32 182.0,982.32 226.0,982.32 226.0,938.32 226.0,894.32" stroke="#235d42" stroke-width="6" fill="none" stroke-linejoin="round"/><path d="M94.0 977.32L94.0 987.32" stroke="#183f39" stroke-width="2" fill="none"/><path d="M138.0 977.32L138.0 987.32" stroke="#183f39" stroke-width="2" fill="none"/><path d="M182.0 977.32L182.0 987.32" stroke="#183f39" stroke-width="2" fill="none"/><path d="M221.0 938.32L231.0 938.32" stroke="#183f39" stroke-width="2" fill="none"/><path d="M69.4 977.32L76.4 982.32L69.4 987.32" stroke="#235d42" stroke-width="3" fill="none"/><path d="M221.0 965.12L226.0 958.12L231.0 965.12" stroke="#235d42" stroke-width="3" fill="none"/><circle cx="50.0" cy="982.32" r="12" fill="#fffdf5" stroke="#183f39" stroke-width="2"/><text x="50.0" y="987.32" font-size="14" font-weight="700" text-anchor="middle" fill="#183f39">P</text><path d="M226.0 879.32L241.0 894.32L226.0 909.32L211.0 894.32Z" fill="#fffdf5" stroke="#183f39" stroke-width="2"/><text x="226.0" y="899.32" font-size="14" font-weight="700" text-anchor="middle" fill="#183f39">G</text><path d="M50.0 1006.32L94.0 1006.32" stroke="#9a5f14" stroke-width="2" fill="none"/><path d="M50.0 1001.32L50.0 1011.32" stroke="#9a5f14" stroke-width="2" fill="none"/><path d="M94.0 1001.32L94.0 1011.32" stroke="#9a5f14" stroke-width="2" fill="none"/><text x="50.0" y="1031.3200000000002" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">One edge: 2 m</text><text x="288" y="1031.3200000000002" font-size="16" font-weight="700" text-anchor="end" fill="#183f39">East →</text><text x="32" y="1059.3200000000002" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">P: Post Office · G: Garden</text><text x="32" y="1092.3200000000002" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">East: 4 edges × 2 m = 8 m.</text><text x="32" y="1117.3200000000002" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">North: 2 edges × 2 m = 4 m.</text><text x="32" y="1142.3200000000002" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">Route: 6 edges × 2 m = 12 m.</text><text x="32" y="1174.3200000000002" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">Count line intervals along</text><text x="32" y="1197.3200000000002" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">the route, not dots or filled</text><text x="32" y="1220.3200000000002" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">squares.</text><rect x="16" y="1273.3200000000002" width="288" height="474" rx="14" fill="#fffdf5" stroke="#b1c2b3" stroke-width="2"/><text x="32" y="1304.3200000000002" font-size="19" font-weight="700" text-anchor="start" fill="#183f39">1 edge represents 4 m</text><text x="32" y="1335.64" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">↑ North</text><path d="M50.0 1355.64L50.0 1487.64" stroke="#b1c2b3" stroke-width="1" fill="none"/><path d="M94.0 1355.64L94.0 1487.64" stroke="#b1c2b3" stroke-width="1" fill="none"/><path d="M138.0 1355.64L138.0 1487.64" stroke="#b1c2b3" stroke-width="1" fill="none"/><path d="M182.0 1355.64L182.0 1487.64" stroke="#b1c2b3" stroke-width="1" fill="none"/><path d="M226.0 1355.64L226.0 1487.64" stroke="#b1c2b3" stroke-width="1" fill="none"/><path d="M270.0 1355.64L270.0 1487.64" stroke="#b1c2b3" stroke-width="1" fill="none"/><path d="M50.0 1355.64L270.0 1355.64" stroke="#b1c2b3" stroke-width="1" fill="none"/><path d="M50.0 1399.64L270.0 1399.64" stroke="#b1c2b3" stroke-width="1" fill="none"/><path d="M50.0 1443.64L270.0 1443.64" stroke="#b1c2b3" stroke-width="1" fill="none"/><path d="M50.0 1487.64L270.0 1487.64" stroke="#b1c2b3" stroke-width="1" fill="none"/><polyline points="50.0,1487.64 94.0,1487.64 138.0,1487.64 138.0,1443.64" stroke="#235d42" stroke-width="6" fill="none" stroke-linejoin="round"/><path d="M94.0 1482.64L94.0 1492.64" stroke="#183f39" stroke-width="2" fill="none"/><path d="M69.4 1482.64L76.4 1487.64L69.4 1492.64" stroke="#235d42" stroke-width="3" fill="none"/><path d="M133.0 1470.44L138.0 1463.44L143.0 1470.44" stroke="#235d42" stroke-width="3" fill="none"/><circle cx="50.0" cy="1487.64" r="12" fill="#fffdf5" stroke="#183f39" stroke-width="2"/><text x="50.0" y="1492.64" font-size="14" font-weight="700" text-anchor="middle" fill="#183f39">P</text><path d="M138.0 1428.64L153.0 1443.64L138.0 1458.64L123.0 1443.64Z" fill="#fffdf5" stroke="#183f39" stroke-width="2"/><text x="138.0" y="1448.64" font-size="14" font-weight="700" text-anchor="middle" fill="#183f39">G</text><path d="M50.0 1511.64L94.0 1511.64" stroke="#9a5f14" stroke-width="2" fill="none"/><path d="M50.0 1506.64L50.0 1516.64" stroke="#9a5f14" stroke-width="2" fill="none"/><path d="M94.0 1506.64L94.0 1516.64" stroke="#9a5f14" stroke-width="2" fill="none"/><text x="50.0" y="1536.64" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">One edge: 4 m</text><text x="288" y="1536.64" font-size="16" font-weight="700" text-anchor="end" fill="#183f39">East →</text><text x="32" y="1564.64" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">P: Post Office · G: Garden</text><text x="32" y="1597.64" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">East: 2 edges × 4 m = 8 m.</text><text x="32" y="1622.64" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">North: 1 edge × 4 m = 4 m.</text><text x="32" y="1647.64" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">Route: 3 edges × 4 m = 12 m.</text><text x="32" y="1679.64" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">Count line intervals along</text><text x="32" y="1702.64" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">the route, not dots or filled</text><text x="32" y="1725.64" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">squares.</text><text x="16" y="1788.64" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">The 4 m key uses fewer map edges.</text><text x="16" y="1811.64" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">Both drawings still represent 8 m</text><text x="16" y="1834.64" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">east, then 4 m north: the same</text><text x="16" y="1857.64" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">12 m route.</text><rect x="16" y="1895.64" width="288" height="58" rx="10" fill="#fffdf5" stroke="#235d42" stroke-width="1"/><text x="160.0" y="1919.64" font-size="16" font-weight="700" text-anchor="middle" fill="#183f39">Hear this view</text><text x="16" y="1980.64" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">Workshop</text><text x="304" y="1980.64" font-size="16" font-weight="700" text-anchor="end" fill="#183f39">Grown-up notes</text></g></svg>
