<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1216" viewBox="0 0 820 1216" role="img" aria-labelledby="title desc"><title id="title">Same route, different scale — 820 static proposal</title><desc id="desc">Static open-comparison proposal at 2 m selected. Both equal-pitch grids show the same invented route: Post Office to Garden, 8 meters east then 4 meters north, 12 meters total. The 2-meter key draws four east and two north edges; the 4-meter key draws two east and one north edge. Neither physical route nor destination has changed.</desc><rect width="820" height="1216" fill="#f6f8ef"/><g font-family="Trebuchet MS, Verdana, sans-serif" fill="#183f39"><text x="32" y="35" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">← Cartographer’s Table</text><text x="32" y="80" font-size="30" font-weight="700" text-anchor="start" fill="#183f39">Same route, different scale</text><text x="32" y="117" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">The visitor wants a smaller drawing of the same route. Try another edge key, then</text><text x="32" y="140" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">compare the maps.</text><rect x="32" y="173" width="756" height="99" rx="10" fill="#edf4e8"/><text x="46" y="198" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">Invented town route: Post Office → Garden. Go 8 m east, then 4 m north. The route is</text><text x="46" y="221" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">12 m long.</text><text x="46" y="251" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">Our purpose: change the drawing, keep the route.</text><text x="32" y="294" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">Invented distances, not a real journey. These drawings cannot predict real travel.</text><text x="32" y="317" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">Screen edges are not measured centimeters.</text><rect x="32" y="358" width="372.0" height="58" rx="10" fill="#edf4e8" stroke="#235d42" stroke-width="3"/><text x="218.0" y="382" font-size="16" font-weight="700" text-anchor="middle" fill="#183f39">2 m per edge</text><text x="218.0" y="404" font-size="16" font-weight="700" text-anchor="middle" fill="#183f39">✓ Selected</text><rect x="416.0" y="358" width="372.0" height="58" rx="10" fill="#fffdf5" stroke="#235d42" stroke-width="1"/><text x="602.0" y="382" font-size="16" font-weight="700" text-anchor="middle" fill="#183f39">4 m per edge</text><rect x="32" y="430" width="372.0" height="58" rx="10" fill="#fffdf5" stroke="#235d42" stroke-width="1"/><text x="218.0" y="454" font-size="16" font-weight="700" text-anchor="middle" fill="#183f39">Show one map</text><rect x="416.0" y="430" width="372.0" height="58" rx="10" fill="#fffdf5" stroke="#235d42" stroke-width="1"/><text x="602.0" y="454" font-size="16" font-weight="700" text-anchor="middle" fill="#183f39">Undo last change</text><rect x="32" y="512" width="368.0" height="495" rx="14" fill="#fffdf5" stroke="#b1c2b3" stroke-width="2"/><text x="48" y="543" font-size="19" font-weight="700" text-anchor="start" fill="#183f39">1 edge represents 2 m</text><text x="48" y="574.32" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">↑ North</text><path d="M96.0 594.32L96.0 738.32" stroke="#b1c2b3" stroke-width="1" fill="none"/><path d="M144.0 594.32L144.0 738.32" stroke="#b1c2b3" stroke-width="1" fill="none"/><path d="M192.0 594.32L192.0 738.32" stroke="#b1c2b3" stroke-width="1" fill="none"/><path d="M240.0 594.32L240.0 738.32" stroke="#b1c2b3" stroke-width="1" fill="none"/><path d="M288.0 594.32L288.0 738.32" stroke="#b1c2b3" stroke-width="1" fill="none"/><path d="M336.0 594.32L336.0 738.32" stroke="#b1c2b3" stroke-width="1" fill="none"/><path d="M96.0 594.32L336.0 594.32" stroke="#b1c2b3" stroke-width="1" fill="none"/><path d="M96.0 642.32L336.0 642.32" stroke="#b1c2b3" stroke-width="1" fill="none"/><path d="M96.0 690.32L336.0 690.32" stroke="#b1c2b3" stroke-width="1" fill="none"/><path d="M96.0 738.32L336.0 738.32" stroke="#b1c2b3" stroke-width="1" fill="none"/><polyline points="96.0,738.32 144.0,738.32 192.0,738.32 240.0,738.32 288.0,738.32 288.0,690.32 288.0,642.32" stroke="#235d42" stroke-width="6" fill="none" stroke-linejoin="round"/><path d="M144.0 733.32L144.0 743.32" stroke="#183f39" stroke-width="2" fill="none"/><path d="M192.0 733.32L192.0 743.32" stroke="#183f39" stroke-width="2" fill="none"/><path d="M240.0 733.32L240.0 743.32" stroke="#183f39" stroke-width="2" fill="none"/><path d="M283.0 690.32L293.0 690.32" stroke="#183f39" stroke-width="2" fill="none"/><path d="M117.8 733.32L124.8 738.32L117.8 743.32" stroke="#235d42" stroke-width="3" fill="none"/><path d="M283.0 718.9200000000001L288.0 711.9200000000001L293.0 718.9200000000001" stroke="#235d42" stroke-width="3" fill="none"/><circle cx="96.0" cy="738.32" r="12" fill="#fffdf5" stroke="#183f39" stroke-width="2"/><text x="96.0" y="743.32" font-size="14" font-weight="700" text-anchor="middle" fill="#183f39">P</text><path d="M288.0 627.32L303.0 642.32L288.0 657.32L273.0 642.32Z" fill="#fffdf5" stroke="#183f39" stroke-width="2"/><text x="288.0" y="647.32" font-size="14" font-weight="700" text-anchor="middle" fill="#183f39">G</text><path d="M96.0 762.32L144.0 762.32" stroke="#9a5f14" stroke-width="2" fill="none"/><path d="M96.0 757.32L96.0 767.32" stroke="#9a5f14" stroke-width="2" fill="none"/><path d="M144.0 757.32L144.0 767.32" stroke="#9a5f14" stroke-width="2" fill="none"/><text x="96.0" y="787.32" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">One edge: 2 m</text><text x="384.0" y="787.32" font-size="16" font-weight="700" text-anchor="end" fill="#183f39">East →</text><text x="48" y="815.32" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">P: Post Office · G: Garden</text><text x="48" y="848.32" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">East: 4 edges × 2 m = 8 m.</text><text x="48" y="873.32" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">North: 2 edges × 2 m = 4 m.</text><text x="48" y="898.32" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">Route: 6 edges × 2 m = 12 m.</text><text x="48" y="930.32" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">Count line intervals along the route,</text><text x="48" y="953.32" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">not dots or filled squares.</text><rect x="420.0" y="512" width="368.0" height="495" rx="14" fill="#fffdf5" stroke="#b1c2b3" stroke-width="2"/><text x="436.0" y="543" font-size="19" font-weight="700" text-anchor="start" fill="#183f39">1 edge represents 4 m</text><text x="436.0" y="574.32" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">↑ North</text><path d="M484.0 594.32L484.0 738.32" stroke="#b1c2b3" stroke-width="1" fill="none"/><path d="M532.0 594.32L532.0 738.32" stroke="#b1c2b3" stroke-width="1" fill="none"/><path d="M580.0 594.32L580.0 738.32" stroke="#b1c2b3" stroke-width="1" fill="none"/><path d="M628.0 594.32L628.0 738.32" stroke="#b1c2b3" stroke-width="1" fill="none"/><path d="M676.0 594.32L676.0 738.32" stroke="#b1c2b3" stroke-width="1" fill="none"/><path d="M724.0 594.32L724.0 738.32" stroke="#b1c2b3" stroke-width="1" fill="none"/><path d="M484.0 594.32L724.0 594.32" stroke="#b1c2b3" stroke-width="1" fill="none"/><path d="M484.0 642.32L724.0 642.32" stroke="#b1c2b3" stroke-width="1" fill="none"/><path d="M484.0 690.32L724.0 690.32" stroke="#b1c2b3" stroke-width="1" fill="none"/><path d="M484.0 738.32L724.0 738.32" stroke="#b1c2b3" stroke-width="1" fill="none"/><polyline points="484.0,738.32 532.0,738.32 580.0,738.32 580.0,690.32" stroke="#235d42" stroke-width="6" fill="none" stroke-linejoin="round"/><path d="M532.0 733.32L532.0 743.32" stroke="#183f39" stroke-width="2" fill="none"/><path d="M505.79999999999995 733.32L512.8 738.32L505.79999999999995 743.32" stroke="#235d42" stroke-width="3" fill="none"/><path d="M575.0 718.9200000000001L580.0 711.9200000000001L585.0 718.9200000000001" stroke="#235d42" stroke-width="3" fill="none"/><circle cx="484.0" cy="738.32" r="12" fill="#fffdf5" stroke="#183f39" stroke-width="2"/><text x="484.0" y="743.32" font-size="14" font-weight="700" text-anchor="middle" fill="#183f39">P</text><path d="M580.0 675.32L595.0 690.32L580.0 705.32L565.0 690.32Z" fill="#fffdf5" stroke="#183f39" stroke-width="2"/><text x="580.0" y="695.32" font-size="14" font-weight="700" text-anchor="middle" fill="#183f39">G</text><path d="M484.0 762.32L532.0 762.32" stroke="#9a5f14" stroke-width="2" fill="none"/><path d="M484.0 757.32L484.0 767.32" stroke="#9a5f14" stroke-width="2" fill="none"/><path d="M532.0 757.32L532.0 767.32" stroke="#9a5f14" stroke-width="2" fill="none"/><text x="484.0" y="787.32" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">One edge: 4 m</text><text x="772.0" y="787.32" font-size="16" font-weight="700" text-anchor="end" fill="#183f39">East →</text><text x="436.0" y="815.32" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">P: Post Office · G: Garden</text><text x="436.0" y="848.32" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">East: 2 edges × 4 m = 8 m.</text><text x="436.0" y="873.32" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">North: 1 edge × 4 m = 4 m.</text><text x="436.0" y="898.32" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">Route: 3 edges × 4 m = 12 m.</text><text x="436.0" y="930.32" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">Count line intervals along the route,</text><text x="436.0" y="953.32" font-size="16" font-weight="400" text-anchor="start" fill="#183f39">not dots or filled squares.</text><text x="32" y="1035" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">The 4 m key uses fewer map edges. Both drawings still represent 8 m east, then 4 m</text><text x="32" y="1058" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">north: the same 12 m route.</text><rect x="32" y="1096" width="756" height="58" rx="10" fill="#fffdf5" stroke="#235d42" stroke-width="1"/><text x="410.0" y="1120" font-size="16" font-weight="700" text-anchor="middle" fill="#183f39">Hear this view</text><text x="32" y="1181" font-size="16" font-weight="700" text-anchor="start" fill="#183f39">Workshop</text><text x="788" y="1181" font-size="16" font-weight="700" text-anchor="end" fill="#183f39">Grown-up notes</text></g></svg>
