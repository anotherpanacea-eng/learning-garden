name: secret-scan

# The one hosted check here: a credential-pattern scan with gitleaks' default
# rules (API tokens and keys, not plain account IDs). This public repository
# is deployed from a Cloudflare account, and a committed credential would be
# public and permanent (merge commits keep every PR commit), so scan the full
# history. It doesn't replace reviewing the staged diff for account
# configuration or private information. Everything else runs locally: see
# AGENTS.md "Checks".
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks, full history)
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --no-banner --redact -v
